name: Build WDA IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS'

      - name: Write entitlements
        run: |
          cat > entitlements.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
              <key>application-identifier</key>
              <string>$(AppIdentifierPrefix)com.facebook.WebDriverAgentRunner</string>
              <key>keychain-access-groups</key>
              <array>
                  <string>$(AppIdentifierPrefix)com.facebook.WebDriverAgentRunner</string>
              </array>
          </dict>
          </plist>
          PLIST

      - name: Build
        run: |
          xcodebuild build \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -allowProvisioningUpdates

      - name: Package
        run: |
          APP=$(find ./build/Build/Products -name "*.app" \
            -not -path "*/PlugIns/*" | head -1)
          echo "Found: $APP"

          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign - \
                --entitlements entitlements.plist "$f" 2>/dev/null || true
            fi
          done

          codesign --force --deep --sign - \
            --entitlements entitlements.plist "$APP"

          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r WebDriverAgent.ipa Payload/
          ls -lh WebDriverAgent.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-IPA
          path: WebDriverAgent.ipa
          retention-days: 30
