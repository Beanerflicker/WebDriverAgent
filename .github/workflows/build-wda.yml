name: Build WDA IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-12
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner

      - name: Build
        run: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Find and verify app
        run: |
          APP=$(find ./build -name "*.app" -not -path "*/PlugIns/*" | head -1)
          echo "Found app: $APP"
          echo "Contents:"
          ls "$APP"
          echo "Has Info.plist: $(test -f "$APP/Info.plist" && echo YES || echo NO)"

      - name: Package IPA
        run: |
          APP=$(find ./build -name "*.app" -not -path "*/PlugIns/*" | head -1)
          
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
              <key>application-identifier</key>
              <string>$(AppIdentifierPrefix)com.facebook.WebDriverAgentRunner</string>
              <key>keychain-access-groups</key>
              <array>
                  <string>$(AppIdentifierPrefix)com.facebook.WebDriverAgentRunner</string>
              </array>
          </dict>
          </plist>
          EOF

          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign - \
                --entitlements entitlements.plist "$f" 2>/dev/null || true
            fi
          done

          codesign --force --deep --sign - \
            --entitlements entitlements.plist "$APP"

          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r WebDriverAgent.ipa Payload/
          echo "IPA size: $(du -sh WebDriverAgent.ipa)"
          echo "IPA contents:"
          zipinfo WebDriverAgent.ipa | grep Info.plist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-IPA
          path: WebDriverAgent.ipa
          retention-days: 30
