name: Build WDA IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-12

    steps:
      - name: Checkout WebDriverAgent
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install dependencies
        run: |
          brew install xcbeautify || true
          cd $GITHUB_WORKSPACE
          pip3 install fb-idb || true

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -allowProvisioningUpdates 2>/dev/null || true

      - name: Write entitlements
        run: |
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
              <key>application-identifier</key>
              <string>$(AppIdentifierPrefix)com.facebook.WebDriverAgentRunner</string>
              <key>keychain-access-groups</key>
              <array>
                  <string>$(AppIdentifierPrefix)com.facebook.WebDriverAgentRunner</string>
              </array>
              <key>com.apple.developer.team-identifier</key>
              <string>*</string>
          </dict>
          </plist>
          EOF

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA with entitlements
        run: |
          APP=$(find ./build -name "*.app" \
            -not -path "*/PlugIns/*" \
            -not -path "*Runner.app/Frameworks/*" | head -1)
          echo "App: $APP"

          # Inject entitlements into every binary in the bundle
          find "$APP" -type f -perm +111 | while read bin; do
            codesign --force --sign - \
              --entitlements entitlements.plist \
              "$bin" 2>/dev/null || true
          done

          # Sign the whole bundle
          codesign --force --deep --sign - \
            --entitlements entitlements.plist \
            "$APP"

          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r WebDriverAgent.ipa Payload/
          echo "IPA size: $(du -sh WebDriverAgent.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-IPA
          path: WebDriverAgent.ipa
          retention-days: 30
