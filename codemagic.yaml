workflows:
  build-wda:
    name: Build WDA IPA (Signed)
    max_build_duration: 25
    environment:
      xcode: 16.0
      ios_signing:
        provisioning_profiles:
          - name: "WDA_Development"           # Codemagic Ref Name (to download the file)
            bundle_identifier: "com.beanerflicker.wda.34QXW692J2"
        certificates:
          - name: "WDA_Profile"               # Codemagic Ref Name (to download the cert)
      vars:
        BUNDLE_ID: "com.beanerflicker.wda.34QXW692J2"
        TEAM_ID: "34QXW692J2"
        # This MUST match the 'Name' you typed on the Apple Portal
        APPLE_PORTAL_NAME: "WDA_Profile"
        XCODE_PROJECT: "WebDriverAgent.xcodeproj"
        XCODE_SCHEME: "WebDriverAgentRunner"
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Prepare Project and Signing
        script: |
          # 1. Patch the project file with your Bundle ID and Team ID
          find . -type f -name "project.pbxproj" -exec sed -i '' "s/com.facebook.WebDriverAgentRunner/$BUNDLE_ID/g" {} +
          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          
          # 2. Set the Provisioning Profile name in the project settings
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*;/PROVISIONING_PROFILE_SPECIFIER = \"$APPLE_PORTAL_NAME\";/g" "$XCODE_PROJECT/project.pbxproj"

          # 3. Install the certificate and profile to the build machine keychain
          xcode-project use-profiles
      - name: Build and Package IPA
        script: |
          rm -rf build Payload WebDriverAgent.ipa

          # 4. Build the app
          # We use APPLE_PORTAL_NAME here so Xcode finds the internal name
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            -derivedDataPath ./build \
