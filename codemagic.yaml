workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner
    scripts:

      # ── 1. Resolve Swift package dependencies ──────────────────────────────
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner

      # ── 2. Build unsigned binary ───────────────────────────────────────────
      #   We build unsigned first so we can patch dylib load commands before
      #   signing.  Any signing at build time would be invalidated by patching.
      - name: Build unsigned
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.beanerflicker.WebDriverAgentRunner

      # ── 3. Bundle and patch libraries ─────────────────────────────────────
      #
      #   Root cause of the crash (IPS: 494B6028, 2026-05-24):
      #     +[XCTRunnerDaemonSession sharedSession] assertion failure
      #     at -[XCUIDevice initLocalDeviceWithPlatform:]
      #
      #   This crash happens at LAUNCH because testmanagerd is not set up —
      #   meaning WDA was opened by tapping the icon.  The binary patches here
      #   fix the RUNTIME framework compatibility issues so that once WDA IS
      #   launched correctly (via tidevice/Appium), it doesn't immediately abort.
      #
      #   Three fixes applied:
      #   (a) Copy lib_TestingInterop.dylib into the app bundle so the embedded
      #       copy is found at @loader_path instead of the system @rpath which
      #       is unavailable inside the app sandbox.
      #   (b) Patch Testing.framework's rpath reference to use @loader_path.
      #   (c) Weak-link the _Testing_Foundation.framework reference in every
      #       binary that links it hard — libXCTestSwiftSupport, XCTestCore,
      #       and the runner binary itself.  Hard-linking a framework that lives
      #       outside the bundle causes dyld to abort on iOS 26 if the path
      #       resolves differently than the build-time expectation.
      - name: Bundle and patch libraries
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"

          # Verify the app was actually built
          if [ ! -d "$APP" ]; then
            echo "ERROR: App bundle not found at $APP"
            find ./build -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
          echo "App bundle found: $APP"
          echo "Contents:"
          ls "$APP/Frameworks/" 2>/dev/null || echo "(no Frameworks dir yet)"

          # (a) Copy lib_TestingInterop.dylib into bundle Frameworks
          LIB_SRC="/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/usr/lib/lib_TestingInterop.dylib"
          if [ -f "$LIB_SRC" ]; then
            cp "$LIB_SRC" "$APP/Frameworks/"
            echo "Copied lib_TestingInterop.dylib"
          else
            echo "WARNING: lib_TestingInterop.dylib not found at expected path, searching..."
            FOUND=$(find /Applications/Xcode.app -name "lib_TestingInterop.dylib" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" "$APP/Frameworks/"
              echo "Copied from: $FOUND"
            else
              echo "ERROR: lib_TestingInterop.dylib not found anywhere in Xcode.app"
              exit 1
            fi
          fi

          # (b) Patch Testing.framework rpath so it finds the bundled interop lib
          install_name_tool \
            -change "@rpath/lib_TestingInterop.dylib" \
              "@loader_path/../lib_TestingInterop.dylib" \
            "$APP/Frameworks/Testing.framework/Testing" 2>/dev/null || true
          echo "Patched Testing.framework rpath"

          # (c) Write and run the weak-link patcher on all three binaries
          #     that hard-link _Testing_Foundation.framework
          cat << 'PYEOF' | base64 -d > /tmp/patch_weak.py

PYEOF

          # Patch all three binaries that can hard-link _Testing_Foundation
          python3 /tmp/patch_weak.py \
            "$APP/Frameworks/libXCTestSwiftSupport.dylib" \
            "$APP/Frameworks/XCTestCore.framework/XCTestCore" \
            "$APP/WebDriverAgentRunner-Runner"
          echo "All weak-link patches complete"

          echo "Final Frameworks:"
          ls -lh "$APP/Frameworks/"

      # ── 4. Sign with developer certificate ────────────────────────────────
      #   Uses the exact entitlements from your provisioning profile:
      #     UUID: e3fd8446-5416-4a26-ac8b-f25b92f8a2dc
      #     Team: 34QXW692J2 (Joshua Watts)
      #   Profile matched by UUID directly — not by fragile string search.
      - name: Sign with developer certificate
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          TEAM_ID="34QXW692J2"
          PROFILE_UUID="e3fd8446-5416-4a26-ac8b-f25b92f8a2dc"
          APP_ID="${TEAM_ID}.com.beanerflicker.WebDriverAgentRunner.xctrunner"

          # Find certificate
          CERT=$(security find-identity -v -p codesigning \
            | grep "Apple Development" | head -1 \
            | awk -F'"' '{print $2}')
          if [ -z "$CERT" ]; then
            echo "ERROR: No Apple Development certificate found"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Certificate: $CERT"

          # Find provisioning profile by UUID (exact match — no fragile grep)
          PROFILE=""
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            security cms -D -i "$f" > /tmp/profile_check.plist 2>/dev/null
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile_check.plist 2>/dev/null || echo "")
            if [ "$UUID" = "$PROFILE_UUID" ]; then
              PROFILE="$f"
              echo "Found profile by UUID: $f"
              break
            fi
          done

          # Fallback: match by application-identifier containing xctrunner
          if [ -z "$PROFILE" ]; then
            echo "UUID match failed, falling back to app-id match..."
            for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
              security cms -D -i "$f" > /tmp/profile_check.plist 2>/dev/null
              FOUND_ID=$(/usr/libexec/PlistBuddy -c \
                "Print :Entitlements:application-identifier" \
                /tmp/profile_check.plist 2>/dev/null || echo "")
              if echo "$FOUND_ID" | grep -q "beanerflicker.*xctrunner"; then
                PROFILE="$f"
                echo "Fallback matched: $f  (app-id: $FOUND_ID)"
                break
              fi
            done
          fi

          if [ -z "$PROFILE" ]; then
            echo "ERROR: No matching provisioning profile found."
            echo "Profiles available:"
            for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
              security cms -D -i "$f" > /tmp/profile_check.plist 2>/dev/null
              echo "  $f"
              /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile_check.plist 2>/dev/null
              /usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile_check.plist 2>/dev/null
            done
            exit 1
          fi

          cp "$PROFILE" "$APP/embedded.mobileprovision"
          echo "Embedded provisioning profile"

          # Write entitlements exactly matching the profile
          python3 -c "
import plistlib
entitlements = {
  'application-identifier': '${APP_ID}',
  'com.apple.developer.team-identifier': '${TEAM_ID}',
  'get-task-allow': True,
  'keychain-access-groups': ['${TEAM_ID}.*', 'com.apple.token']
}
with open('/tmp/entitlements.plist', 'wb') as f:
  plistlib.dump(entitlements, f, fmt=plistlib.FMT_XML)
print('Entitlements written')
"

          # Sign in correct order: deepest first, app bundle last
          # 1. Loose dylibs
          find "$APP" -name "*.dylib" | while read f; do
            codesign --force --sign "$CERT" "$f" 2>/dev/null || true
          done

          # 2. Frameworks inside PlugIns (nested deepest)
          find "$APP/PlugIns" -name "*.framework" | sort -r | while read f; do
            codesign --force --sign "$CERT" "$f" 2>/dev/null || true
          done

          # 3. xctest bundles inside PlugIns
          find "$APP/PlugIns" -maxdepth 1 -name "*.xctest" | while read f; do
            codesign --force --sign "$CERT" "$f" 2>/dev/null || true
          done

          # 4. Top-level Frameworks
          find "$APP/Frameworks" -maxdepth 1 -name "*.framework" | while read f; do
            codesign --force --sign "$CERT" "$f" 2>/dev/null || true
          done

          # 5. App bundle itself (must be last)
          codesign --force --sign "$CERT" \
            --entitlements /tmp/entitlements.plist \
            "$APP"

          # Verify
          codesign --verify --verbose=2 "$APP" \
            && echo "SIGNATURE VALID" \
            || { echo "SIGNATURE FAILED"; exit 1; }

          echo "Embedded entitlements:"
          codesign -d --entitlements :- "$APP" 2>/dev/null || true

      # ── 5. Package IPA ─────────────────────────────────────────────────────
      - name: Package IPA
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -rp "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/ -x "*.DS_Store"
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"
          echo "IPA contents (top level):"
          /usr/bin/unzip -l ~/WebDriverAgent.ipa | head -30

    artifacts:
      - ~/WebDriverAgent.ipa
