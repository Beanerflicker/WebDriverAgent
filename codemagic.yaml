workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner.xctrunner
    scripts:
      - name: Build WDA
        script: |
          set -e
          # Phase 1: Build the Host App (provides the home screen icon)
          xcodebuild build \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

          # Phase 2: Build the Test Runner (.xctrunner)
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Bundle and patch libraries
        script: |
          set -e
          PROD_DIR="./build/Build/Products/Debug-iphoneos"
          
          # Explicitly locate products
          RUNNER=$(find "$PROD_DIR" -name "WebDriverAgentRunner-Runner.app")
          HOST=$(find "$PROD_DIR" -name "WebDriverAgentRunner.app")
          
          if [ -z "$HOST" ] || [ -z "$RUNNER" ]; then
            echo "ERROR: Missing bundles. Host: [$HOST] Runner: [$RUNNER]"
            ls -R "$PROD_DIR"
            exit 1
          fi

          echo "Using Runner: $RUNNER"
          echo "Using Host: $HOST"

          # 1. Aligns Bundle IDs with your profiles
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.beanerflicker.WebDriverAgentRunner.xctrunner" "$RUNNER/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.beanerflicker.WebDriverAgentRunner" "$HOST/Info.plist"

          # 2. Patch Runner for iOS 26 compatibility
          XCODE_DEV=$(xcode-select -p)
          mkdir -p "$RUNNER/Frameworks"
          cp "$XCODE_DEV/Platforms/iPhoneOS.platform/Developer/usr/lib/lib_TestingInterop.dylib" "$RUNNER/Frameworks/"
          
          cat << 'EOF' > /tmp/patch_weak.py
          import struct, sys, os
          def patch(fp):
              if not os.path.exists(fp): return
              with open(fp, "rb") as f: data = bytearray(f.read())
              if len(data) < 4: return
              if struct.unpack("<I", data[:4])[0] != 0xFEEDFACF: return
              ncmds = struct.unpack("<I", data[16:20])[0]
              cursor = 32
              for _ in range(ncmds):
                  cmd, sz = struct.unpack("<II", data[cursor:cursor+8])
                  if cmd == 0x0c:
                      off = struct.unpack("<I", data[cursor+8:cursor+12])[0]
                      name = data[cursor+off:cursor+sz].split(b"\x00")[0]
                      if b"_Testing_Foundation" in name:
                          struct.pack_into("<I", data, cursor, 0x80000018)
                  cursor += sz
              with open(fp, "wb") as f: f.write(data)
          patch(sys.argv[1])
          EOF

          python3 /tmp/patch_weak.py "$RUNNER/Frameworks/libXCTestSwiftSupport.dylib"
          python3 /tmp/patch_weak.py "$RUNNER/Frameworks/XCTestCore.framework/XCTestCore"
          python3 /tmp/patch_weak.py "$RUNNER/WebDriverAgentRunner-Runner"

          # 3. Dynamic Signing
          EXP_KEY=$(security find-identity -v -p codesigning | grep "Apple Development" | head -n 1 | awk -F'"' '{print $2}')
          
          sign_bundle() {
            local TARGET=$1
            local BUNDLE_ID=$2
            # Match profile by Bundle ID string
            local PROFILE=$(grep -l "$BUNDLE_ID" /Users/builder/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
            
            echo "Signing $TARGET with profile $PROFILE"
            cp "$PROFILE" "$TARGET/embedded.mobileprovision"
            
            # Generate Entitlements
            python3 -c "import plistlib; data=open('$TARGET/embedded.mobileprovision','rb').read(); start=data.find(b'<?xml'); end=data.find(b'</plist>')+8; plist=plistlib.loads(data[start:end]); plistlib.dump(plist['Entitlements'], open('/tmp/ent.plist','wb'))"
            
            # Deep Signing
            find "$TARGET" -depth -name "*.framework" -exec codesign --force --sign "$EXP_KEY" {} \;
            find "$TARGET" -depth -name "*.dylib" -exec codesign --force --sign "$EXP_KEY" {} \;
            codesign --force --sign "$EXP_KEY" --entitlements /tmp/entitlements.plist "$TARGET"
          }

          sign_bundle "$HOST" "com.beanerflicker.WebDriverAgentRunner"
          sign_bundle "$RUNNER" "com.beanerflicker.WebDriverAgentRunner.xctrunner"

      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r ./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner.app Payload/
          cp -r ./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app Payload/
          zip -r WebDriverAgent.ipa Payload
    artifacts:
      - WebDriverAgent.ipa
