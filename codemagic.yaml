workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: 26.4
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner

      - name: Build unsigned
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.beanerflicker.WebDriverAgentRunner

      - name: Bundle missing library
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"

          LIB="/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/usr/lib/lib_TestingInterop.dylib"
          echo "Library exists: $(test -f "$LIB" && echo YES || echo NO)"

          cp "$LIB" "$APP/Frameworks/"
          echo "Copied lib_TestingInterop.dylib"

          TESTING="$APP/Frameworks/Testing.framework/Testing"
          install_name_tool -change \
            "@rpath/lib_TestingInterop.dylib" \
            "@loader_path/../lib_TestingInterop.dylib" \
            "$TESTING" 2>/dev/null || true

          echo "Patch applied"
          echo "Frameworks:"
          ls "$APP/Frameworks/"

      - name: Sign with developer certificate
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"

          CERT=$(security find-identity -v -p codesigning \
            | grep "Apple Development" | head -1 \
            | awk -F'"' '{print $2}')
          echo "Certificate: $CERT"

          PROFILE=""
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            security cms -D -i "$f" > /tmp/profile_check.plist 2>/dev/null
            APP_ID=$(/usr/libexec/PlistBuddy -c \
              "Print :Entitlements:application-identifier" \
              /tmp/profile_check.plist 2>/dev/null || echo "")
            if echo "$APP_ID" | grep -q "xctrunner"; then
              PROFILE="$f"
              echo "Using profile: $f"
              echo "App ID: $APP_ID"
              break
            fi
          done

          if [ -z "$PROFILE" ]; then
            echo "ERROR: xctrunner profile not found"
            exit 1
          fi

          cp "$PROFILE" "$APP/embedded.mobileprovision"
          echo "Embedded profile"

          python3 -c "
          import plistlib
          entitlements = {
            'application-identifier': '34QXW692J2.com.beanerflicker.WebDriverAgentRunner.xctrunner',
            'com.apple.developer.team-identifier': '34QXW692J2',
            'get-task-allow': True,
            'keychain-access-groups': ['34QXW692J2.*', 'com.apple.token']
          }
          with open('/tmp/entitlements.plist', 'wb') as f:
            plistlib.dump(entitlements, f, fmt=plistlib.FMT_XML)
          print('Entitlements written')
          "

          echo "Entitlements:"
          cat /tmp/entitlements.plist

          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign "$CERT" \
                --entitlements /tmp/entitlements.plist \
                "$f" 2>/dev/null || true
            fi
          done

          codesign --force --deep --sign "$CERT" \
            --entitlements /tmp/entitlements.plist \
            "$APP"

          codesign --verify --verbose "$APP" \
            && echo "SIGNATURE VALID" \
            || echo "SIGNATURE FAILED"

      - name: Package IPA
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          mkdir -p /tmp/Payload
          cp -rp "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"

    artifacts:
      - ~/WebDriverAgent.ipa
