workflows:
  build-wda:
    name: Build WDA IPA (Signed)
    max_build_duration: 25
    environment:
      xcode: 16.0
      ios_signing:
        provisioning_profiles:
          - name: "WDA_Development"
            target: "WebDriverAgentRunner" # This satisfies the "target" error
        certificates:
          - name: "Joshua Watts"
      vars:
        # This matches the ID from your Apple Portal screenshot
        BUNDLE_ID: "com.beanerflicker.wda.34QXW692J2"
        TEAM_ID: "34QXW692J2"
        # This is the Name of the profile as it appears on the Apple Portal
        APPLE_PROFILE_NAME: "WDA_Profile"
        XCODE_PROJECT: "WebDriverAgent.xcodeproj"
        XCODE_SCHEME: "WebDriverAgentRunner"
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Prepare Project and Signing
        script: |
          # 1. Force the project to use your specific Bundle ID and Team ID
          find . -type f -name "project.pbxproj" -exec sed -i '' "s/com.facebook.WebDriverAgentRunner/$BUNDLE_ID/g" {} +
          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          
          # 2. Link the Apple Profile Name into the project settings
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*;/PROVISIONING_PROFILE_SPECIFIER = \"$APPLE_PROFILE_NAME\";/g" "$XCODE_PROJECT/project.pbxproj"

          # 3. Initialize the signing environment on the builder
          xcode-project use-profiles
      - name: Build and Package IPA
        script: |
          # 1. Clean previous artifacts
          rm -rf build Payload WebDriverAgent.ipa

          # 2. Build the app
          # We use "Apple Development" as the pointer; Xcode finds the Joshua Watts cert automatically
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Development"

          # 3. Find the compiled .app folder
          RUNNER_APP=$(find ./build/Build/Products -name "*.app" -type d | head -n 1)
          
          if [ -z "$RUNNER_APP" ]; then
            echo "FAILED: Could not find the .app folder!"
            exit 1
          fi

          # 4. Construct the Payload folder structure
          mkdir Payload
          cp -LR "$RUNNER_APP" Payload/
          
          # 5. Zip into IPA (using -ry to preserve symlinks)
          zip -ry WebDriverAgent.ipa Payload
    artifacts:
      - "*.ipa"
