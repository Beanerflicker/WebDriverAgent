workflows:
  build-wda:
    name: Build WDA IPA
    max_build_duration: 25
    environment:
      xcode: 26.4
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner
      - name: Build
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            EXCLUDED_ARCHS=x86_64
      - name: Package
        script: |
          APP=$(find ./build -name "*.app" \
            -not -path "*/PlugIns/*" | head -1)
          echo "Found: $APP"

          # Convert ALL plists to XML first
          find "$APP" -name "*.plist" | while read plist; do
            plutil -convert xml1 "$plist" 2>/dev/null || true
          done

          # Set bundle ID
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleIdentifier com.beanerflicker.wda" \
            "$APP/Info.plist"

          # Verify bundle ID was set
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleIdentifier" "$APP/Info.plist")"

          # Sign
          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign - "$f" 2>/dev/null || true
            fi
          done
          codesign --force --deep --sign - "$APP"

          # Package
          mkdir -p /tmp/Payload
          cp -r "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"
    artifacts:
      - ~/WebDriverAgent.ipa
