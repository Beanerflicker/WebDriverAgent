workflows:
  build-wda:
    name: Build WDA IPA
    max_build_duration: 25
    environment:
      xcode: 26.4
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner
      - name: Build
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO
      - name: Find app
        script: |
          find ./build -name "*.app" | head -20
          find ./build -name "Info.plist" | head -10
      - name: Package IPA
        script: |
          APP=$(find ./build -name "*.app" \
            -not -path "*/PlugIns/*" | head -1)
          echo "APP=$APP"
          echo "Info.plist: $(test -f "$APP/Info.plist" && echo YES || echo NO)"
          mkdir -p /tmp/Payload
          cp -r "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.zip Payload/
          mv WebDriverAgent.zip ~/WebDriverAgent.ipa
          echo "Size: $(du -sh ~/WebDriverAgent.ipa)"
          ls -la ~/WebDriverAgent.ipa
    artifacts:
      - ~/WebDriverAgent.ipa
