workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner.xctrunner
    scripts:
      - name: Revert to Pristine Upstream Appium State
        script: |
          set -e
          echo "[*] Cleaning local workspace..."
          git checkout -- . || true
          
          # Add the official, pristine Appium repository as a remote to discard any local fork pollution
          echo "[*] Fetching clean files from official Appium upstream..."
          git remote add upstream https://github.com/appium/WebDriverAgent.git || true
          git fetch upstream
          
          # Force the runner files to match the official, modern, unpolluted versions
          git checkout upstream/master -- WebDriverAgentRunner/UITestingUITests.m || true
          git checkout upstream/master -- WebDriverAgentRunner/UITestingUITests.mm || true
          echo "[+] Workspace successfully restored to clean Appium master state."

      - name: Build WDA
        script: |
          set -e
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            RUN_CLANG_STATIC_ANALYZER=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Bundle and Package WDA
        script: |
          set -e
          APP=$(find ./build/Build/Products/Debug-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then 
            echo "[-] ERROR: No .app bundle found"
            exit 1
          fi
          
          echo "[+] Processing bundle path: $APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL" "$APP/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :LSBackgroundOnly" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.beanerflicker.WebDriverAgentRunner.xctrunner" "$APP/Info.plist"
          
          # Extract entitlements from the provisioning profile
          EXP_KEY=$(security find-identity -v -p codesigning | grep "Development" | head -n 1 | awk -F'"' '{print $2}')
          PROF=$(grep -l "com.beanerflicker.WebDriverAgentRunner.xctrunner" /Users/builder/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          cp "$PROF" "$APP/embedded.mobileprovision"
          python3 -c "import plistlib; data=open('$APP/embedded.mobileprovision','rb').read(); start=data.find(b'<?xml'); end=data.find(b'</plist>')+8; plist=plistlib.loads(data[start:end]); plistlib.dump(plist['Entitlements'], open('/tmp/entitlements.plist','wb'))"

          # Sign native WebDriverAgent target binaries inside the plug-ins directory
          XCT_PLUGINS="$APP/PlugIns"
          if [ -d "$XCT_PLUGINS" ]; then
              find "$XCT_PLUGINS" -name "*.xctest" | while read -r plugin; do
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$plugin"
              done
          fi
          
          APP_FRAMEWORKS="$APP/Frameworks"
          if [ -d "$APP_FRAMEWORKS" ]; then
              find "$APP_FRAMEWORKS" -name "*.framework" | while read -r framework; do
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$framework"
              done
          fi
          
          # Sign the host app bundle with extracted developer entitlements
          codesign --force --sign "$EXP_KEY" --entitlements /tmp/entitlements.plist --timestamp=none "$APP"

      - name: Package IPA
        script: |
          set -e
          APP=$(find ./build/Build/Products/Debug-iphoneos -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r WebDriverAgent.ipa Payload
    artifacts:
      - WebDriverAgent.ipa
