workflows:
  build-wda:
    name: Build WDA IPA (Signed)
    max_build_duration: 25
    environment:
      xcode: 15.4 # Changed to a standard stable version, adjust if needed
      ios_signing:
        provisioning_profiles:
          - profile_name: WDA_Profile
            bundle_identifier: com.beanerflicker.wda
        certificates:
          - certificate_name: Apple Development
      vars:
        BUNDLE_ID: "com.beanerflicker.wda"
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner
      - name: Build
        script: |
          # We now ALLOW code signing and use the profile you uploaded
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            clean build
      - name: Package and Sign
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"

          # 1. Convert plists
          find "$APP" -name "*.plist" | while read plist; do
            plutil -convert xml1 "$plist" 2>/dev/null || true
          done

          # 2. Fix Bundle ID
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"

          # 3. Copy required Test Interop Library
          LIB="/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/usr/lib/lib_TestingInterop.dylib"
          mkdir -p "$APP/Frameworks"
          cp "$LIB" "$APP/Frameworks/"

          # 4. Patch Framework paths (keeping your original logic)
          TESTING="$APP/Frameworks/Testing.framework/Testing"
          install_name_tool -change "@rpath/lib_TestingInterop.dylib" "@loader_path/../lib_TestingInterop.dylib" "$TESTING" 2>/dev/null || true
          
          XCTESTCORE="$APP/Frameworks/XCTestCore.framework/XCTestCore"
          install_name_tool -change "@rpath/Testing.framework/Testing" "@loader_path/../Testing.framework/Testing" "$XCTESTCORE" 2>/dev/null || true

          # 5. Sign the app with YOUR real Apple Certificate
          # Codemagic puts your certificate name in the CM_CERTIFICATE_NAME variable
          echo "Signing with certificate: $CM_CERTIFICATE_NAME"
          
          # Sign internal binaries
          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign "$CM_CERTIFICATE_NAME" "$f" 2>/dev/null || true
            fi
