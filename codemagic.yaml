workflows:
  build-wda:
    name: Build WDA IPA (Signed)
    max_build_duration: 25
    environment:
      xcode: 16.0
      ios_signing:
        # Using this simple format usually bypasses the "Profile reference" validator error
        distribution_type: development
        bundle_identifier: com.beanerflicker.wda.34QXW692J2
      vars:
        BUNDLE_ID: "com.beanerflicker.wda.34QXW692J2"
        TEAM_ID: "34QXW692J2"
        XCODE_PROJECT: "WebDriverAgent.xcodeproj"
        XCODE_SCHEME: "WebDriverAgentRunner"
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Prepare Project and Signing
        script: |
          # 1. Force the Bundle ID and Team ID into the project file
          find . -type f -name "project.pbxproj" -exec sed -i '' "s/com.facebook.WebDriverAgentRunner/$BUNDLE_ID/g" {} +
          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          
          # 2. Install the certificate and profile selected in the UI
          xcode-project use-profiles
          
          # 3. Extract the UUID of the profile (The most reliable way to sign)
          PROV_UUID=$(grep -aA1 UUID "$CM_PROVISIONING_PROFILE" | grep -o "[-A-Z0-9]\{36\}")
          echo "Using Profile UUID: $PROV_UUID"
          echo "PROV_UUID=$PROV_UUID" >> $CM_ENV
      - name: Build and Package IPA
        script: |
          rm -rf build Payload WebDriverAgent.ipa
          
          # 4. Build using the UUID instead of the Name
          # This bypasses the "No profile matching name found" error
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE="$PROV_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

          # 5. Locate and package the app
          RUNNER_APP=$(find ./build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$RUNNER_APP" ]; then echo "App not found"; exit 1; fi
          
          mkdir Payload
          cp -LR "$RUNNER_APP" Payload/
          zip -ry WebDriverAgent.ipa Payload
    artifacts:
      - "*.ipa"
