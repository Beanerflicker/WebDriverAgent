workflows:
  build-wda:
    name: Build WDA IPA (Signed)
    max_build_duration: 25
    environment:
      xcode: 16.0
      ios_signing:
        provisioning_profiles:
          - name: "WDA_Development"     # Matches your Provisioning Profile name exactly
            bundle_identifier: "com.beanerflicker.wda"
        certificates:
          - name: "WDA_Profile"         # Matches your Certificate Reference name exactly
      vars:
        BUNDLE_ID: "com.beanerflicker.wda"
        TEAM_ID: "TK5BU69PB4"           # Your Team ID from the logs
        PROFILE_NAME: "WDA_Development"
        XCODE_PROJECT: "WebDriverAgent.xcodeproj"
        XCODE_SCHEME: "WebDriverAgentRunner"
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Prepare Project and Signing
        script: |
          # 1. Global Patch: Replace default Facebook ID with yours in the project file
          find . -type f -name "project.pbxproj" -exec sed -i '' "s/com.facebook.WebDriverAgentRunner/$BUNDLE_ID/g" {} +
          
          # 2. Force Team ID and Manual Signing Style
          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          
          # 3. Apply Profile Specifier ONLY to the Runner target via the pbxproj
          # This avoids the 'WebDriverAgentLib does not support provisioning profiles' error
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*;/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" "$XCODE_PROJECT/project.pbxproj"

          # 4. Initialize the signing environment
          xcode-project use-profiles
      - name: Build and Package IPA
        script: |
          # 1. Clean previous build artifacts
          rm -rf build Payload WebDriverAgent.ipa

          # 2. Build the app
          # We do not pass PROVISIONING_PROFILE_SPECIFIER as a flag here; 
          # it is handled by the pbxproj patch above to keep the Library build clean.
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID"

          # 3. Find the compiled .app folder
          RUNNER_APP=$(find ./build/Build/Products -name "*.app" -type d | head -n 1)
          
          if [ -z "$RUNNER_APP" ]; then
            echo "FAILED: Could not find the .app folder!"
            exit 1
          fi

          # 4. Construct the Payload folder structure
          mkdir Payload
          cp -LR "$RUNNER_APP" Payload/
          
          # 5. Zip into IPA (using -ry to preserve symbolic links)
          zip -ry WebDriverAgent.ipa Payload
    artifacts:
      - "*.ipa"
