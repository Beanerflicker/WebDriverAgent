workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner.xctrunner
    scripts:
      - name: Revert Workspace to Pristine Upstream State
        script: |
          set -e
          echo "[*] Discarding local workspace modifications..."
          git checkout -- . || true
          
          # Add the official, pristine Appium repository as a remote to discard any local fork pollution
          echo "[*] Fetching clean files from official Appium upstream..."
          git remote add upstream https://github.com/appium/WebDriverAgent.git || true
          git fetch upstream
          
          # Force the compiler-failing runner files to match the clean upstream versions
          git checkout upstream/master -- WebDriverAgentRunner/UITestingUITests.m || true
          git checkout upstream/master -- WebDriverAgentRunner/UITestingUITests.mm || true
          echo "[+] Workspace successfully aligned with clean Appium master."

      - name: Inject Compatibility Category into Core Library
        script: |
          set -e
          echo "[*] Locating core library compilation source..."
          TARGET_M_FILE=$(find . -path "*WebDriverAgentLib*/*" -name "WDAConfiguration.m" | head -n 1)
          if [ -z "$TARGET_M_FILE" ]; then
              echo "[!] Warning: WDAConfiguration.m not found. Searching for any library source..."
              TARGET_M_FILE=$(find . -path "*WebDriverAgentLib*/*" -name "*.m" | head -n 1)
          fi
          if [ -z "$TARGET_M_FILE" ]; then
              echo "[-] Error: No compiled source targets inside WebDriverAgentLib folder."
              exit 1
          fi
          
          echo "[+] Resetting target file to pristine state..."
          git checkout -- "$TARGET_M_FILE"
          
          # Append Obj-C category on UIPresentationController (pure, non-XCTest library file)
          echo "" >> "$TARGET_M_FILE"
          echo "@interface UIPresentationController (WDAStub)" >> "$TARGET_M_FILE"
          echo "@end" >> "$TARGET_M_FILE"
          echo "" >> "$TARGET_M_FILE"
          echo "@implementation UIPresentationController (WDAStub)" >> "$TARGET_M_FILE"
          echo "+ (id)configurationFromCommandLineArguments:(id)arg1 userDefaults:(id)arg2 requiresTestBundleURL:(BOOL)arg3 outError:(id *)arg4 {" >> "$TARGET_M_FILE"
          echo "    return nil;" >> "$TARGET_M_FILE"
          echo "}" >> "$TARGET_M_FILE"
          echo "@end" >> "$TARGET_M_FILE"
          echo "[+] Compatibility category appended successfully."

      - name: Build WDA
        script: |
          set -e
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            RUN_CLANG_STATIC_ANALYZER=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Bundle and Package WDA
        script: |
          set -e
          APP=$(find ./build/Build/Products/Debug-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then 
            echo "[-] ERROR: No .app bundle found"
            exit 1
          fi
          
          echo "[+] Processing bundle path: $APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL" "$APP/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :LSBackgroundOnly" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.beanerflicker.WebDriverAgentRunner.xctrunner" "$APP/Info.plist"
          
          # Exact-match binary-patch script to swap XCTCommandLineToolHelper with UIPresentationController
          # 24-character exact match (no spaces or null-byte padding needed)
          cat << '          EOF' > /tmp/patch_runner.py
          import sys

          def patch_file(filepath):
              try:
                  with open(filepath, 'rb') as f:
                      data = bytearray(f.read())
              except Exception:
                  print(f"[-] Error opening file: {filepath}")
                  return
              
              patched = False
              
              # Patch the dynamic symbol name (38 bytes)
              # Overwrite with _OBJC_CLASS_$_UIPresentationController (exactly 38 characters)
              old_sym = b'_OBJC_CLASS_$_XCTCommandLineToolHelper'
              new_sym = b'_OBJC_CLASS_$_UIPresentationController'
              if old_sym in data:
                  idx = 0
                  while True:
                      idx = data.find(old_sym, idx)
                      if idx == -1: break
                      data[idx:idx+38] = new_sym
                      patched = True
                      idx += 38
                      
              # Patch the raw class name string (24 bytes)
              # Overwrite with UIPresentationController (exactly 24 characters)
              old_class = b'XCTCommandLineToolHelper'
              new_class = b'UIPresentationController'
              if old_class in data:
                  idx = 0
                  while True:
                      idx = data.find(old_class, idx)
                      if idx == -1: break
                      data[idx:idx+24] = new_class
                      patched = True
                      idx += 24
                      
              if patched:
                  with open(filepath, 'wb') as f:
                      f.write(data)
                  print(f"[+] Successfully binary-patched symbols in {filepath}")
              else:
                  print(f"[-] Targeting symbols not found in {filepath}")

          patch_file(sys.argv[1])
          EOF
          
          echo "[+] Running exact-match binary patch on the host test runner..."
          python3 /tmp/patch_runner.py "$APP/WebDriverAgentRunner-Runner"

          # Extract entitlements from the provisioning profile
          EXP_KEY=$(security find-identity -v -p codesigning | grep "Development" | head -n 1 | awk -F'"' '{print $2}')
          PROF=$(grep -l "com.beanerflicker.WebDriverAgentRunner.xctrunner" /Users/builder/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          cp "$PROF" "$APP/embedded.mobileprovision"
          python3 -c "import plistlib; data=open('$APP/embedded.mobileprovision','rb').read(); start=data.find(b'<?xml'); end=data.find(b'</plist>')+8; plist=plistlib.loads(data[start:end]); plistlib.dump(plist['Entitlements'], open('/tmp/entitlements.plist','wb'))"

          # Write the ultimate, robust Python codesigning script
          cat << '          EOF' > /tmp/sign_all.py
          import os, sys, subprocess

          app_path = sys.argv[1]
          identity = sys.argv[2]
          entitlements = sys.argv[3] if len(sys.argv) > 3 else None

          # Walk the bundle and sign binaries first (inside-out)
          all_files = []
          for root, dirs, files in os.walk(app_path):
              for file in files:
                  fp = os.path.join(root, file)
                  if file.endswith(('.png', '.plist', '.car', '.provision', '.xml', '.strings', '.nib', '.db', '.html', '.css', '.js')):
                      continue
                  all_files.append(fp)

          # Deepest files first
          all_files.sort(key=lambda x: len(x), reverse=True)

          for fp in all_files:
              try:
                  with open(fp, 'rb') as f:
                      magic = f.read(4)
              except Exception:
                  continue
              
              # Check for Mach-O thin or fat binary magic bytes
              if magic in (b'\xcf\xfa\xed\xfe', b'\xbe\xba\xfe\xca'):
                  print(f"[+] Signing binary: {fp}")
                  cmd = ['codesign', '--force', '--sign', identity, '--timestamp=none']
                  if entitlements and fp == os.path.join(app_path, os.path.basename(app_path).replace('.app', '')):
                      print(f"[+] Applying entitlements to main executable: {fp}")
                      cmd += ['--entitlements', entitlements]
                  
                  cmd.append(fp)
                  subprocess.run(cmd, check=True)

          # Finally, sign the bundles themselves (.xctest, .framework, .app)
          bundles = []
          for root, dirs, files in os.walk(app_path):
              for d in dirs:
                  dp = os.path.join(root, d)
                  if d.endswith(('.xctest', '.framework', '.app')):
                      bundles.append(dp)
          
          bundles.sort(key=lambda x: len(x), reverse=True)
          for bp in bundles:
              print(f"[+] Signing bundle: {bp}")
              cmd = ['codesign', '--force', '--sign', identity, '--timestamp=none']
              if entitlements and bp == app_path:
                  cmd += ['--entitlements', entitlements]
              cmd.append(bp)
              subprocess.run(cmd, check=True)
          EOF

          echo "[+] Running ultimate, robust codesigning walk..."
          python3 /tmp/sign_all.py "$APP" "$EXP_KEY" "/tmp/entitlements.plist"

      - name: Package IPA
        script: |
          set -e
          APP=$(find ./build/Build/Products/Debug-iphoneos -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r WebDriverAgent.ipa Payload
    artifacts:
      - WebDriverAgent.ipa
