workflows:
  build-wda:
    name: Build WDA IPA (Signed)
    max_build_duration: 25
    environment:
      xcode: 16.0
      vars:
        BUNDLE_ID: "com.beanerflicker.wda.34QXW692J2"
        TEAM_ID: "34QXW692J2"
        PROFILE_NAME: "WDA_Profile" 
        XCODE_PROJECT: "WebDriverAgent.xcodeproj"
        XCODE_SCHEME: "WebDriverAgentRunner"
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Prepare Project and Signing
        script: |
          find . -type f -name "project.pbxproj" -exec sed -i '' "s/com.facebook.WebDriverAgentRunner/$BUNDLE_ID/g" {} +
          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*;/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" "$XCODE_PROJECT/project.pbxproj"

          # This command will now use the profiles you select in the UI
          xcode-project use-profiles
      - name: Build and Package IPA
        script: |
          rm -rf build Payload WebDriverAgent.ipa
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

          RUNNER_APP=$(find ./build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$RUNNER_APP" ]; then exit 1; fi
          mkdir Payload
          cp -LR "$RUNNER_APP" Payload/
          zip -ry WebDriverAgent.ipa Payload
    artifacts:
      - "*.ipa"
