# Definitive corrected codemagic.yaml
# Bypasses Xcode compile-time signing checks and performs correct manual codesigning

workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner
    scripts:
      - name: Resolve packages
        script: |
          nsyslog="{\"level\":\"info\"}"
          echo "$nsyslog"
      - name: Build WDA
        script: |
          set -e
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Bundle and patch libraries
        script: |
          set -e
          APP=$(find ./build -name "WebDriverAgentRunner-Runner.app" | head -n 1)
          if [ -z "$APP" ]; then
              echo "ERROR: App bundle not found"
              exit 1
          fi
          echo "App bundle found: $APP"

          # 1. Locate and copy lib_TestingInterop.dylib
          XCODE_DEV=$(xcode-select -p)
          TARGET_DIR="$APP/Frameworks"
          mkdir -p "$TARGET_DIR"

          DYLIB_PATH="$XCODE_DEV/Platforms/iPhoneOS.platform/Developer/usr/lib/lib_TestingInterop.dylib"
          if [ -f "$DYLIB_PATH" ]; then
              cp "$DYLIB_PATH" "$TARGET_DIR/"
              echo "Copied lib_TestingInterop.dylib"
          else
              echo "ERROR: lib_TestingInterop.dylib not found at $DYLIB_PATH"
              exit 1
          fi

          # 2. Patch Testing.framework rpath
          install_name_tool -add_rpath "@loader_path/Frameworks" "$APP/Frameworks/Testing.framework/Testing" || true

          # 3. Apply the weak-link patches via Python
          cat << 'PYEOF' > /tmp/patch_weak.py
          import struct
          import sys

          def patch_fat_or_thin(path):
              with open(path, 'rb') as f:
                  data = bytearray(f.read())
              
              if len(data) < 4:
                  return
              
              magic = struct.unpack('<I', data[:4])[0]
              offsets = []
              
              if magic == 0xCAFEBABE:  # FAT Binary
                  num_fat = struct.unpack('>I', data[4:8])[0]
                  for i in range(num_fat):
                      off = struct.unpack('>I', data[12 + i*20 : 16 + i*20])[0]
                      offsets.append(off)
              elif magic == 0xFEEDFACF:  # Thin 64-bit Binary
                  offsets.append(0)
              else:
                  return

              for offset in offsets:
                  if offset + 128 > len(data):
                      continue
                  magic_thin = struct.unpack('<I', data[offset:offset+4])[0]
                  if magic_thin != 0xFEEDFACF:
                      continue
                  
                  num_cmds = struct.unpack('<I', data[offset+16:offset+20])[0]
                  cursor = offset + 32
                  
                  for _ in range(num_cmds):
                      if cursor + 8 > len(data):
                          break
                      cmd, cmdsize = struct.unpack('<II', data[cursor:cursor+8])
                      if cmd == 0x0c:  # LC_LOAD_DYLIB
                          str_offset = struct.unpack('<I', data[cursor+8:cursor+12])[0]
                          dylib_name_start = cursor + str_offset
                          name_data = data[dylib_name_start : dylib_name_start + 128].split(b'\x00')[0]
                          if b'_Testing_Foundation.framework' in name_data:
                              struct.pack_into('<I', data, cursor, 0x80000018)  # Change to LC_LOAD_WEAK_DYLIB
                              print(f"Patched dependency in binary slice at offset {offset}")
                      cursor += cmdsize

              with open(path, 'wb') as f:
                  f.write(data)

          if __name__ == '__main__':
              patch_fat_or_thin(sys.argv[1])
          PYEOF

          python3 /tmp/patch_weak.py "$APP/Frameworks/libXCTestSwiftSupport.dylib"
          python3 /tmp/patch_weak.py "$APP/Frameworks/XCTestCore.framework/XCTestCore" || true
          python3 /tmp/patch_weak.py "$APP/WebDriverAgentRunner-Runner" || true

          # 4. Generate Entitlements Plist
          cat << 'PYEOF' > /tmp/entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>34QXW692J2.com.beanerflicker.WebDriverAgentRunner.xctrunner</string>
              <key>com.apple.developer.team-identifier</key>
              <string>34QXW692J2</string>
              <key>get-task-allow</key>
              <true/>
              <key>keychain-access-groups</key>
              <array>
                  <string>34QXW692J2.*</string>
                  <string>com.apple.token</string>
              </array>
          </dict>
          </plist>
          PYEOF

          # 5. Correct Codesigning logic
          EXP_KEY="34QXW692J2"
          
          # A. Sign Frameworks & dylibs (WITHOUT entitlements)
          find "$APP/Frameworks" -mindepth 1 -maxdepth 1 | while read -r framework; do
              echo "Signing framework: $framework"
              codesign --force --sign "$EXP_KEY" "$framework"
          done

          # B. Sign PlugIns / .xctest bundles if they exist (WITHOUT entitlements)
          if [ -d "$APP/PlugIns" ]; then
              find "$APP/PlugIns" -mindepth 1 -maxdepth 1 | while read -r plugin; do
                  echo "Signing plugin: $plugin"
                  codesign --force --sign "$EXP_KEY" "$plugin"
              done
          fi

          # C. Sign the parent App bundle (WITH entitlements)
          echo "Signing parent app bundle with entitlements"
          codesign --force --sign "$EXP_KEY" --entitlements /tmp/entitlements.plist "$APP"

          # 6. Verify signature
          codesign --verify --deep --verbose=2 "$APP"

          # 7. Package IPA
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r WebDriverAgent.ipa Payload
          echo "IPA packaging complete"

    artifacts:
      - WebDriverAgent.ipa
