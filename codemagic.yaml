workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner.xctrunner
    scripts:
      - name: Revert Workspace to Pristine Upstream State
        script: |
          set -e
          echo "[*] Discarding local workspace modifications..."
          git checkout -- . || true
          
          # Add the official, pristine Appium repository as a remote to discard any local fork pollution
          echo "[*] Fetching clean files from official Appium upstream..."
          git remote add upstream https://github.com/appium/WebDriverAgent.git || true
          git fetch upstream
          
          # Force all runner files to match the clean upstream versions
          git checkout upstream/master -- WebDriverAgentRunner/UITestingUITests.m || true
          git checkout upstream/master -- WebDriverAgentRunner/UITestingUITests.mm || true
          git checkout upstream/master -- WebDriverAgentRunner/WebDriverAgentRunnerRunner.m || true
          echo "[+] Workspace successfully aligned with clean Appium master."

      - name: Inject Compatibility Stub into Runner Main Entrypoint
        script: |
          set -e
          echo "[*] Locating runner main entrypoint source..."
          TARGET_M_FILE=$(find . -path "*WebDriverAgentRunner*/*" -name "WebDriverAgentRunnerRunner.m" | head -n 1)
          if [ -z "$TARGET_M_FILE" ]; then
              echo "[-] Error: WebDriverAgentRunnerRunner.m not found."
              exit 1
          fi
          
          # Append the clean class stub directly into the runner's compiled main source file
          echo "" >> "$TARGET_M_FILE"
          echo "@interface XCTCommandLineToolHelper : NSObject" >> "$TARGET_M_FILE"
          echo "+ (id)configurationFromCommandLineArguments:(id)arg1 userDefaults:(id)arg2 requiresTestBundleURL:(BOOL)arg3 outError:(id *)arg4;" >> "$TARGET_M_FILE"
          echo "@end" >> "$TARGET_M_FILE"
          echo "" >> "$TARGET_M_FILE"
          echo "@implementation XCTCommandLineToolHelper" >> "$TARGET_M_FILE"
          echo "+ (id)configurationFromCommandLineArguments:(id)arg1 userDefaults:(id)arg2 requiresTestBundleURL:(BOOL)arg3 outError:(id *)arg4 {" >> "$TARGET_M_FILE"
          echo "    return nil;" >> "$TARGET_M_FILE"
          echo "}" >> "$TARGET_M_FILE"
          echo "@end" >> "$TARGET_M_FILE"
          echo "[+] Compatibility stub injected cleanly into runner main source."

      - name: Build WDA
        script: |
          set -e
          # Compile the runner app natively from source using the modern application scheme
          xcodebuild build \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner_Runner \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            RUN_CLANG_STATIC_ANALYZER=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0

      - name: Bundle and Package WDA
        script: |
          set -e
          APP=$(find ./build/Build/Products/Debug-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then 
            echo "[-] ERROR: No .app bundle found"
            exit 1
          fi
          
          echo "[+] Processing bundle path: $APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL" "$APP/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :LSBackgroundOnly" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.beanerflicker.WebDriverAgentRunner.xctrunner" "$APP/Info.plist"
          
          # Extract entitlements from the provisioning profile
          EXP_KEY=$(security find-identity -v -p codesigning | grep "Development" | head -n 1 | awk -F'"' '{print $2}')
          PROF=$(grep -l "com.beanerflicker.WebDriverAgentRunner.xctrunner" /Users/builder/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          cp "$PROF" "$APP/embedded.mobileprovision"
          python3 -c "import plistlib; data=open('$APP/embedded.mobileprovision','rb').read(); start=data.find(b'<?xml'); end=data.find(b'</plist>')+8; plist=plistlib.loads(data[start:end]); plistlib.dump(plist['Entitlements'], open('/tmp/entitlements.plist','wb'))"

          # Sign WDA's compiled framework bundles inside-out (pushed clean)
          XCT_PLUGINS="$APP/PlugIns"
          if [ -d "$XCT_PLUGINS" ]; then
              find "$XCT_PLUGINS" -type f \( -name "*.dylib" -o -name "WebDriverAgentLib" \) | while read -r lib; do
                  echo "[+] Signing nested binary: $lib"
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$lib"
              done
              find "$XCT_PLUGINS" -name "*.framework" | while read -r fw; do
                  echo "[+] Signing nested framework: $fw"
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$fw"
              done
              find "$XCT_PLUGINS" -name "*.xctest" | while read -r plugin; do
                  echo "[+] Signing nested plugin: $plugin"
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$plugin"
              done
          fi
          
          APP_FRAMEWORKS="$APP/Frameworks"
          if [ -d "$APP_FRAMEWORKS" ]; then
              find "$APP_FRAMEWORKS" -name "*.framework" | while read -r framework; do
                  echo "[+] Signing framework bundle: $framework"
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$framework"
              done
          fi
          
          # Sign the host app bundle with extracted developer entitlements (Pristine structure preserved)
          echo "[+] Signing main host app bundle: $APP"
          codesign --force --sign "$EXP_KEY" --entitlements /tmp/entitlements.plist --timestamp=none "$APP"

      - name: Package IPA
        script: |
          set -e
          APP=$(find ./build/Build/Products/Debug-iphoneos -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r WebDriverAgent.ipa Payload
    artifacts:
      - WebDriverAgent.ipa
