workflows:
  build-wda:
    name: Build WDA IPA
    max_build_duration: 25
    environment:
      xcode: 26.4
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner
      - name: Build
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            EXCLUDED_ARCHS=x86_64
      - name: Package
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"

          # Convert all plists to XML
          find "$APP" -name "*.plist" | while read plist; do
            plutil -convert xml1 "$plist" 2>/dev/null || true
          done

          # Set bundle ID
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleIdentifier com.beanerflicker.wda" \
            "$APP/Info.plist"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleIdentifier" "$APP/Info.plist")"

          # Find and bundle lib_TestingInterop.dylib
          echo "=== Searching for lib_TestingInterop.dylib ==="
          find /Applications/Xcode.app -name "lib_TestingInterop.dylib" 2>/dev/null | head -5
          find /usr/lib/swift -name "lib_TestingInterop.dylib" 2>/dev/null | head -5

          LIB=$(find /Applications/Xcode.app -name "lib_TestingInterop.dylib" \
            -path "*iphoneos*" 2>/dev/null | head -1)

          if [ -z "$LIB" ]; then
            LIB=$(find /Applications/Xcode.app -name "lib_TestingInterop.dylib" \
              2>/dev/null | head -1)
          fi

          if [ -n "$LIB" ]; then
            echo "Found at: $LIB"
            cp "$LIB" "$APP/Frameworks/"
            echo "Bundled lib_TestingInterop.dylib"
          else
            echo "WARNING: lib_TestingInterop.dylib not found on build machine"
          fi

          echo "Frameworks after fix:"
          ls "$APP/Frameworks/"

          # Write entitlements
          cat > /tmp/entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
              <key>application-identifier</key>
              <string>com.beanerflicker.wda</string>
              <key>keychain-access-groups</key>
              <array>
                  <string>com.beanerflicker.wda</string>
              </array>
          </dict>
          </plist>
          EOF

          # Sign with entitlements
          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign - \
                --entitlements /tmp/entitlements.plist \
                "$f" 2>/dev/null || true
            fi
          done
          codesign --force --deep --sign - \
            --entitlements /tmp/entitlements.plist \
            "$APP"

          # Package
          mkdir -p /tmp/Payload
          cp -rp "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"
    artifacts:
      - ~/WebDriverAgent.ipa
