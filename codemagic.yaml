workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner.xctrunner
    scripts:
      - name: Build WDA
        script: |
          set -e
          # Compile natively using Xcode's stable default configurations (No OTHER_LDFLAGS overrides)
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Bundle and patch libraries
        script: |
          set -e
          # 1. Locate the compiled app bundle dynamically
          APP=$(find ./build/Build/Products/Debug-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then 
            echo "[-] ERROR: No .app bundle found in build products"
            exit 1
          fi
          echo "[+] Processing bundle path: $APP"

          # 2. Inject foreground app execution flags to allow icon visibility
          echo "[*] Injecting Foreground Application flags..."
          /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL" "$APP/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :LSBackgroundOnly" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.beanerflicker.WebDriverAgentRunner.xctrunner" "$APP/Info.plist"

          # 3. Apply iOS compatibility patches
          XCODE_DEV=$(xcode-select -p)
          mkdir -p "$APP/Frameworks"
          cp "$XCODE_DEV/Platforms/iPhoneOS.platform/Developer/usr/lib/lib_TestingInterop.dylib" "$APP/Frameworks/"
          
          # Inline Python script to recursively scan the bundle and rename 
          # XCTCommandLineToolHelper to XCTestCase inside the string table
          cat << 'EOF' > /tmp/patch_weak.py
          import sys, os
          
          def patch_file(fp):
              try:
                  with open(fp, "rb") as f: d = bytearray(f.read())
              except Exception:
                  return
              
              # Target and replacement definitions (exactly padded with nulls to maintain byte alignment)
              target1 = b"_OBJC_CLASS_$_XCTCommandLineToolHelper"
              replace1 = b"_OBJC_CLASS_$_XCTestCase\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00"
              
              target2 = b"_OBJC_METACLASS_$_XCTCommandLineToolHelper"
              replace2 = b"_OBJC_METACLASS_$_XCTestCase\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00"
              
              target3 = b"__OBJC_CLASS_$_XCTCommandLineToolHelper"
              replace3 = b"__OBJC_CLASS_$_XCTestCase\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00"
              
              target4 = b"__OBJC_METACLASS_$_XCTCommandLineToolHelper"
              replace4 = b"__OBJC_METACLASS_$_XCTestCase\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00"
              
              modified = False
              if target1 in d:
                  d = d.replace(target1, replace1)
                  modified = True
              if target2 in d:
                  d = d.replace(target2, replace2)
                  modified = True
              if target3 in d:
                  d = d.replace(target3, replace3)
                  modified = True
              if target4 in d:
                  d = d.replace(target4, replace4)
                  modified = True
                  
              if modified:
                  with open(fp, "wb") as f: f.write(d)
                  print(f"[+] Successfully renamed legacy symbols to XCTestCase inside: {os.path.basename(fp)}")

          app_path = sys.argv[1]
          # Walk the entire .app directory recursively and evaluate all files
          for root, dirs, files in os.walk(app_path):
              for file in files:
                  fp = os.path.join(root, file)
                  if file.endswith(('.png', '.plist', '.car', '.provision', '.xml', '.strings', '.nib', '.db')):
                      continue
                  patch_file(fp)
          EOF
          
          # Run the automated deep-bundle binary patcher
          python3 /tmp/patch_weak.py "$APP"

          # 4. Resolve Signing Identity and Provisioning Assets
          EXP_KEY=$(security find-identity -v -p codesigning | grep "Development" | head -n 1 | awk -F'"' '{print $2}')
          echo "[+] Resolved Certificate: $EXP_KEY"

          PROF=$(grep -l "com.beanerflicker.WebDriverAgentRunner.xctrunner" /Users/builder/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          cp "$PROF" "$APP/embedded.mobileprovision"
          echo "[+] Resolved Provisioning Profile: $PROF"
          
          # Extract entitlement schema from profile payload
          python3 -c "import plistlib; data=open('$APP/embedded.mobileprovision','rb').read(); start=data.find(b'<?xml'); end=data.find(b'</plist>')+8; plist=plistlib.loads(data[start:end]); plistlib.dump(plist['Entitlements'], open('/tmp/entitlements.plist','wb'))"

          # 5. Strict Leaf-To-Root Code Signing (Inside-Out Pattern)
          
          # Step A: Sign deep nested libraries inside xctest bundles first (WITHOUT entitlements)
          XCT_FRAMEWORKS="$APP/PlugIns/WebDriverAgentRunner.xctest/Frameworks"
          if [ -d "$XCT_FRAMEWORKS" ]; then
              echo "[*] Signing nested framework dependencies in XCTest folder..."
              find "$XCT_FRAMEWORKS" -type f \( -name "*.dylib" -o -name "WebDriverAgentLib" \) | while read -r lib; do
                  echo "Signing nested leaf library: $lib"
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$lib"
              done
              find "$XCT_FRAMEWORKS" -name "*.framework" | while read -r fw; do
                  echo "Signing nested framework: $fw"
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$fw"
              done
          fi

          # Step B: Sign XCTest plug-in container (WITHOUT entitlements)
          XCT_PLUGINS="$APP/PlugIns"
          if [ -d "$XCT_PLUGINS" ]; then
              echo "[*] Signing XCTest plugins..."
              find "$XCT_PLUGINS" -name "*.xctest" | while read -r plugin; do
                  echo "Signing plugin bundle: $plugin"
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$plugin"
              done
          fi

          # Step C: Sign root framework folder contents (WITHOUT entitlements)
          APP_FRAMEWORKS="$APP/Frameworks"
          if [ -d "$APP_FRAMEWORKS" ]; then
              echo "[*] Signing application level frameworks..."
              find "$APP_FRAMEWORKS" -type f -name "*.dylib" | while read -r dylib; do
                  echo "Signing application dylib: $dylib"
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$dylib"
              done
              find "$APP_FRAMEWORKS" -name "*.framework" | while read -r framework; do
                  echo "Signing application framework: $framework"
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$framework"
              done
          fi

          # Step D: Sign primary application container executable (WITH entitlements, NO deep flag)
          echo "[*] Signing primary application bundle..."
          codesign --force --sign "$EXP_KEY" --entitlements /tmp/entitlements.plist --timestamp=none "$APP"
          
          echo "[+] Code-signing phase completed."

      - name: Package IPA
        script: |
          set -e
          # Construct deployment package containing only the targeted app
          APP=$(find ./build/Build/Products/Debug-iphoneos -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r WebDriverAgent.ipa Payload
          echo "[+] Packaging completed successfully."
    artifacts:
      - WebDriverAgent.ipa
