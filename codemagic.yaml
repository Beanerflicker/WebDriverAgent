workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: 26.4
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner
    scripts:

      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner

      - name: Build unsigned
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.beanerflicker.WebDriverAgentRunner

      - name: Bundle and patch libraries
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: App bundle not found at $APP"
            find ./build -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
          echo "App bundle found"

          # Show Xcode environment so we know exactly what paths exist
          echo "=== Xcode environment ==="
          echo "xcode-select path: $(xcode-select -p)"
          echo "Xcode version: $(xcodebuild -version | head -1)"
          XCODE_DEV=$(xcode-select -p)
          XCODE_APP=$(echo "$XCODE_DEV" | sed 's|/Contents/Developer||')
          echo "Xcode.app path: $XCODE_APP"

          # Search using xcode-select path — works regardless of versioned app name
          LIB_SRC=$(find "$XCODE_DEV/Platforms/iPhoneOS.platform/Developer/usr/lib" \
            -name "lib_TestingInterop.dylib" 2>/dev/null | head -1)

          # Broader fallback search under the whole Xcode developer tree
          if [ -z "$LIB_SRC" ]; then
            echo "Standard path failed, running broader search..."
            LIB_SRC=$(find "$XCODE_DEV" -name "lib_TestingInterop.dylib" 2>/dev/null | head -1)
          fi

          # Last resort: search all of /Applications
          if [ -z "$LIB_SRC" ]; then
            echo "Developer tree search failed, searching /Applications..."
            LIB_SRC=$(find /Applications -name "lib_TestingInterop.dylib" 2>/dev/null | head -1)
          fi

          if [ -z "$LIB_SRC" ]; then
            echo "ERROR: lib_TestingInterop.dylib not found anywhere"
            echo "Listing iPhoneOS platform lib dir:"
            ls "$XCODE_DEV/Platforms/iPhoneOS.platform/Developer/usr/lib/" 2>/dev/null || echo "(dir not found)"
            echo "Listing all dylibs in platform:"
            find "$XCODE_DEV/Platforms/iPhoneOS.platform" -name "*.dylib" 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "Found lib_TestingInterop.dylib at: $LIB_SRC"
          cp "$LIB_SRC" "$APP/Frameworks/"
          echo "Copied lib_TestingInterop.dylib"

          install_name_tool \
            -change "@rpath/lib_TestingInterop.dylib" \
            "@loader_path/../lib_TestingInterop.dylib" \
            "$APP/Frameworks/Testing.framework/Testing" 2>/dev/null || true
          echo "Patched Testing.framework rpath"

          echo "" | base64 -d > /tmp/patch_weak.py

          python3 /tmp/patch_weak.py \
            "$APP/Frameworks/libXCTestSwiftSupport.dylib" \
            "$APP/Frameworks/XCTestCore.framework/XCTestCore" \
            "$APP/WebDriverAgentRunner-Runner"
            "$APP/WebDriverAgentRunner-Runner" "_OBJC_CLASS_\$_XCTCommandLineToolHelper"
          echo "All patches complete"
          echo "Frameworks:"
          ls "$APP/Frameworks/"

      - name: Sign with developer certificate
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          export TEAM_ID="34QXW692J2"
          export APP_ID="${TEAM_ID}.com.beanerflicker.WebDriverAgentRunner.xctrunner"
          PROFILE_UUID="e3fd8446-5416-4a26-ac8b-f25b92f8a2dc"

          CERT=$(security find-identity -v -p codesigning \
            | grep "Apple Development" | head -1 \
            | awk -F'"' '{print $2}')
          if [ -z "$CERT" ]; then
            echo "ERROR: No Apple Development certificate found"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Certificate: $CERT"

          PROFILE=""
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            security cms -D -i "$f" > /tmp/profile_check.plist 2>/dev/null
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile_check.plist 2>/dev/null || echo "")
            if [ "$UUID" = "$PROFILE_UUID" ]; then
              PROFILE="$f"
              echo "Matched profile by UUID"
              break
            fi
          done

          if [ -z "$PROFILE" ]; then
            for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
              security cms -D -i "$f" > /tmp/profile_check.plist 2>/dev/null
              FOUND_ID=$(/usr/libexec/PlistBuddy -c \
                "Print :Entitlements:application-identifier" \
                /tmp/profile_check.plist 2>/dev/null || echo "")
              if echo "$FOUND_ID" | grep -q "beanerflicker.*xctrunner"; then
                PROFILE="$f"
                echo "Fallback matched profile"
                break
              fi
            done
          fi

          if [ -z "$PROFILE" ]; then
            echo "ERROR: No matching provisioning profile found"
            exit 1
          fi

          cp "$PROFILE" "$APP/embedded.mobileprovision"
          echo "Embedded provisioning profile"

          echo "" | base64 -d > /tmp/write_entitlements.py
          python3 /tmp/write_entitlements.py

          find "$APP" -name "*.dylib" | while read f; do
            codesign --force --sign "$CERT" "$f" 2>/dev/null || true
          done
          find "$APP/PlugIns" -name "*.framework" | sort -r | while read f; do
            codesign --force --sign "$CERT" "$f" 2>/dev/null || true
          done
          find "$APP/PlugIns" -maxdepth 1 -name "*.xctest" | while read f; do
            codesign --force --sign "$CERT" "$f" 2>/dev/null || true
          done
          find "$APP/Frameworks" -maxdepth 1 -name "*.framework" | while read f; do
            codesign --force --sign "$CERT" "$f" 2>/dev/null || true
          done
          codesign --force --sign "$CERT" \
            --entitlements /tmp/entitlements.plist \
            "$APP"

          codesign --verify --verbose=2 "$APP" \
            && echo "SIGNATURE VALID" \
            || { echo "SIGNATURE FAILED"; exit 1; }

      - name: Package IPA
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -rp "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/ -x "*.DS_Store"
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"

    artifacts:
      - ~/WebDriverAgent.ipa
