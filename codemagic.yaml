workflows:
  build-wda:
    name: Build WDA IPA
    max_build_duration: 25
    environment:
      xcode: 26.4
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner
      - name: Build
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        script: |
          APP=$(find ./build -name "*.app" \
            -not -path "*/PlugIns/*" | head -1)
          echo "Found: $APP"
          echo "Info.plist exists: $(test -f "$APP/Info.plist" && echo YES || echo NO)"
          ls -la "$APP"
          cd ./build/Build/Products
          mkdir -p Payload
          cp -r "$(basename $APP)" Payload/
          /usr/bin/zip -r WebDriverAgent.zip Payload/
          mv WebDriverAgent.zip WebDriverAgent.ipa
          echo "IPA size: $(du -sh WebDriverAgent.ipa)"
    artifacts:
      - build/Build/Products/WebDriverAgent.ipa
