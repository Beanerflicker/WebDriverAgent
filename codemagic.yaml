workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: 26.4
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner

      - name: Patch project signing
        script: |
          # Force automatic signing in project file for all targets
          sed -i 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' \
            WebDriverAgent.xcodeproj/project.pbxproj

          # Clear any hardcoded provisioning profile specifiers
          sed -i 's/PROVISIONING_PROFILE_SPECIFIER = ".*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' \
            WebDriverAgent.xcodeproj/project.pbxproj

          echo "Patched signing settings:"
          grep "CODE_SIGN_STYLE" WebDriverAgent.xcodeproj/project.pbxproj | sort -u

      - name: Build and Sign
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=34QXW692J2 \
            CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER=com.beanerflicker.WebDriverAgentRunner

      - name: Package IPA
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          echo "App found: $(test -d "$APP" && echo YES || echo NO)"
          echo "File count: $(find "$APP" -type f | wc -l)"

          mkdir -p /tmp/Payload
          cp -rp "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"

    artifacts:
      - ~/WebDriverAgent.ipa
