- name: Sign with developer certificate
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"

          CERT=$(security find-identity -v -p codesigning \
            | grep "Apple Development" | head -1 \
            | awk -F'"' '{print $2}')
          echo "Certificate: $CERT"

          PROFILE=""
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            security cms -D -i "$f" > /tmp/profile_check.plist 2>/dev/null
            APP_ID=$(/usr/libexec/PlistBuddy -c \
              "Print :Entitlements:application-identifier" \
              /tmp/profile_check.plist 2>/dev/null || echo "")
            if echo "$APP_ID" | grep -q "xctrunner"; then
              PROFILE="$f"
              echo "Using profile: $f"
              break
            fi
          done

          cp "$PROFILE" "$APP/embedded.mobileprovision"

          python3 -c "
          import plistlib
          entitlements = {
            'application-identifier': '34QXW692J2.com.beanerflicker.WebDriverAgentRunner.xctrunner',
            'com.apple.developer.team-identifier': '34QXW692J2',
            'get-task-allow': True,
            'keychain-access-groups': ['34QXW692J2.*', 'com.apple.token']
          }
          with open('/tmp/entitlements.plist', 'wb') as f:
            plistlib.dump(entitlements, f, fmt=plistlib.FMT_XML)
          print('Entitlements written')
          "

          # Sign dylibs WITHOUT entitlements
          find "$APP/Frameworks" -name "*.dylib" | while read f; do
            codesign --force --sign "$CERT" "$f" 2>/dev/null || true
          done

          # Sign frameworks WITHOUT entitlements
          find "$APP/Frameworks" -maxdepth 1 -name "*.framework" | while read f; do
            codesign --force --sign "$CERT" "$f" 2>/dev/null || true
          done

          # Sign xctest plugin WITHOUT entitlements
          find "$APP/PlugIns" -name "*.xctest" | while read f; do
            codesign --force --sign "$CERT" "$f" 2>/dev/null || true
          done

          # Sign main app WITH entitlements only
          codesign --force --sign "$CERT" \
            --entitlements /tmp/entitlements.plist \
            "$APP"

          codesign --verify --verbose "$APP" \
            && echo "SIGNATURE VALID" \
            || echo "SIGNATURE FAILED"
