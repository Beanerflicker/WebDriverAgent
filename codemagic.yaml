workflows:
  build-wda:
    name: Build WDA IPA
    max_build_duration: 25
    environment:
      xcode: 26.4
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner
      - name: Build
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            EXCLUDED_ARCHS=x86_64
      - name: Package
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"

          # Convert all plists to XML
          find "$APP" -name "*.plist" | while read plist; do
            plutil -convert xml1 "$plist" 2>/dev/null || true
          done

          # Set bundle ID
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleIdentifier com.beanerflicker.wda" \
            "$APP/Info.plist"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleIdentifier" "$APP/Info.plist")"

          # Search everywhere for Testing.framework and lib_TestingInterop
          echo "=== SEARCHING FOR TESTING LIBS ==="
          find /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform \
            -name "Testing" -o -name "*TestingInterop*" 2>/dev/null | head -20
          find /Applications/Xcode.app/Contents/Developer/Toolchains \
            -name "*TestingInterop*" 2>/dev/null | head -10
          find /Library -name "*TestingInterop*" 2>/dev/null | head -5
          echo "=== END SEARCH ==="

          # Patch XCTestCore to find Testing.framework via @loader_path
          # (looks in the same Frameworks folder where we bundle it)
          XCTESTCORE="$APP/Frameworks/XCTestCore.framework/XCTestCore"
          echo "Current XCTestCore deps:"
          otool -L "$XCTESTCORE" | grep Testing

          install_name_tool -change \
            "/usr/lib/swift/Testing.framework/Testing" \
            "@loader_path/../Testing.framework/Testing" \
            "$XCTESTCORE" 2>/dev/null || true

          install_name_tool -change \
            "@rpath/Testing.framework/Testing" \
            "@loader_path/../Testing.framework/Testing" \
            "$XCTESTCORE" 2>/dev/null || true

          echo "After patch:"
          otool -L "$XCTESTCORE" | grep Testing

          # Patch Testing.framework to find lib_TestingInterop via @loader_path
          TESTING="$APP/Frameworks/Testing.framework/Testing"
          echo "Testing.framework deps:"
          otool -L "$TESTING" | grep -i interop

          install_name_tool -change \
            "@rpath/lib_TestingInterop.dylib" \
            "@loader_path/../../lib_TestingInterop.dylib" \
            "$TESTING" 2>/dev/null || true

          install_name_tool -change \
            "/usr/lib/swift/lib_TestingInterop.dylib" \
            "@loader_path/../../lib_TestingInterop.dylib" \
            "$TESTING" 2>/dev/null || true

          echo "After patch:"
          otool -L "$TESTING" | grep -i interop

          # Write entitlements
          cat > /tmp/entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
              <key>application-identifier</key>
              <string>com.beanerflicker.wda</string>
              <key>keychain-access-groups</key>
              <array>
                  <string>com.beanerflicker.wda</string>
              </array>
          </dict>
          </plist>
          EOF

          # Sign everything
          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign - \
                --entitlements /tmp/entitlements.plist \
                "$f" 2>/dev/null || true
            fi
          done
          codesign --force --deep --sign - \
            --entitlements /tmp/entitlements.plist \
            "$APP"

          # Package
          mkdir -p /tmp/Payload
          cp -rp "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"
    artifacts:
      - ~/WebDriverAgent.ipa
