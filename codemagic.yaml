workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: 26.4
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.wda
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner

      - name: Show signing assets
        script: |
          echo "=== Certificates ==="
          security find-identity -v -p codesigning

          echo "=== Provisioning Profiles ==="
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "--- $(basename $f) ---"
            security cms -D -i "$f" | grep -A1 "UUID\|<key>Name\|TeamIdentifier\|application-identifier" | head -20
            echo ""
          done

      - name: Build and Sign
        script: |
          TEAM_ID="34QXW692J2"

          # Find Runner profile UUID
          RUNNER_UUID=""
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            PLIST=$(security cms -D -i "$f")
            NAME=$(echo "$PLIST" | grep -A1 "<key>Name</key>" \
              | grep string | sed 's/.*<string>//;s/<\/string>//')
            UUID=$(echo "$PLIST" | grep -A1 "<key>UUID</key>" \
              | grep string | sed 's/.*<string>//;s/<\/string>//')
            echo "Found profile: $NAME -> $UUID"
            if echo "$NAME" | grep -qi "runner"; then
              RUNNER_UUID=$UUID
              echo "Using Runner profile: $NAME ($UUID)"
            fi
          done

          if [ -z "$RUNNER_UUID" ]; then
            echo "ERROR: Could not find WDA Runner Development profile"
            exit 1
          fi

          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE=$RUNNER_UUID \
            WEBDRIVERAGENTLIB_PROVISIONING_PROFILE="" \
            WEBDRIVERAGENTLIB_CODE_SIGN_STYLE=Automatic \
            WEBDRIVERAGENTLIB_DEVELOPMENT_TEAM=$TEAM_ID \
            WEBDRIVERAGENTLIB_CODE_SIGN_IDENTITY="Apple Development"

      - name: Package IPA
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          echo "App found: $(test -d "$APP" && echo YES || echo NO)"
          echo "File count: $(find "$APP" -type f | wc -l)"

          mkdir -p /tmp/Payload
          cp -rp "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"

    artifacts:
      - ~/WebDriverAgent.ipa
