workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner.xctrunner
    scripts:
      - name: Build WDA
        script: |
          set -e
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Bundle and patch libraries
        script: |
          set -e
          APP=$(find ./build -name "WebDriverAgentRunner-Runner.app" | head -n 1)
          echo "App bundle found: $APP"

          # 1. Copy Interop Dylib
          XCODE_DEV=$(xcode-select -p)
          cp "$XCODE_DEV/Platforms/iPhoneOS.platform/Developer/usr/lib/lib_TestingInterop.dylib" "$APP/Frameworks/"

          # 2. CFBundleIdentifier Rewrite (The fix for "Did not find test app")
          echo "Updating Bundle ID in Info.plist..."
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.beanerflicker.WebDriverAgentRunner.xctrunner" "$APP/Info.plist"

          # 3. Create Weak-Link Patch Script (Plain text to avoid character errors)
          cat << 'EOF' > /tmp/patch_weak.py
          import struct, sys
          def patch(fp):
              with open(fp, "rb") as f:
                  data = bytearray(f.read())
              magic = struct.unpack("<I", data[:4])[0]
              if magic != 0xFEEDFACF: return
              ncmds = struct.unpack("<I", data[16:20])[0]
              cursor = 32
              for _ in range(ncmds):
                  cmd, sz = struct.unpack("<II", data[cursor:cursor+8])
                  if cmd == 0x0c:
                      off = struct.unpack("<I", data[cursor+8:cursor+12])[0]
                      name = data[cursor+off:cursor+sz].split(b"\x00")[0]
                      if b"_Testing_Foundation" in name:
                          struct.pack_into("<I", data, cursor, 0x80000018)
                  cursor += sz
              with open(fp, "wb") as f:
                  f.write(data)
              print(f"Patched: {fp}")
          if __name__ == "__main__":
              patch(sys.argv[1])
          EOF

          python3 /tmp/patch_weak.py "$APP/Frameworks/libXCTestSwiftSupport.dylib"

          # 4. Handle Provisioning Profile and Entitlements
          PROV_PROFILE=$(find /Users/builder -name "*.mobileprovision" | head -n 1)
          cp "$PROV_PROFILE" "$APP/embedded.mobileprovision"
          
          # Extract Entitlements
          python3 -c "import plistlib; data=open('$APP/embedded.mobileprovision','rb').read(); start=data.find(b'<?xml'); end=data.find(b'</plist>')+8; plist=plistlib.loads(data[start:end]); plistlib.dump(plist['Entitlements'], open('/tmp/entitlements.plist','wb'))"
          
          # 5. Find Team ID and Signing Key
          TEAM_ID=$(python3 -c "import plistlib; p=plistlib.loads(open('/tmp/entitlements.plist','rb').read()); print(p.get('com.apple.developer.team-identifier',''))")
          EXP_KEY=$(security find-identity -v -p codesigning | grep "$TEAM_ID" | head -n 1 | awk -F'"' '{print $2}')
          echo "Using Certificate: $EXP_KEY"

          # 6. RECURSIVE SIGNING (The "Inside-Out" fix)
          # Sign nested frameworks inside Plugins first (Claude's fix)
          find "$APP/PlugIns" -name "*.framework" | while read f; do codesign --force --sign "$EXP_KEY" "$f"; done
          # Sign the .xctest plugins themselves
          find "$APP/PlugIns" -name "*.xctest" | while read f; do codesign --force --sign "$EXP_KEY" "$f"; done
          # Sign top-level frameworks
          find "$APP/Frameworks" -mindepth 1 -maxdepth 1 | while read f; do codesign --force --sign "$EXP_KEY" "$f"; done
          # Sign main bundle last
          codesign --force --sign "$EXP_KEY" --entitlements /tmp/entitlements.plist "$APP"

          codesign --verify --verbose "$APP" && echo "SIGNATURE VALID"

      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r ./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app Payload/
          zip -r WebDriverAgent.ipa Payload
    artifacts:
      - WebDriverAgent.ipa
