workflows:
  build-wda:
    name: Build WDA IPA (Signed)
    max_build_duration: 25
    environment:
      xcode: 16
      ios_signing:
        provisioning_profiles:
          - "WDA_Profile"  # <--- Change this to match your "Reference name"
        certificates:
          - "Apple Development"           # <--- Change this to match your "Reference name"
      vars:
        BUNDLE_ID: "com.beanerflicker.wda"
        XCODE_PROJECT: "WebDriverAgent.xcodeproj"
        XCODE_SCHEME: "WebDriverAgentRunner"
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Set up code signing settings
        script: |
          # This command injects the WDA_Profile and Apple Development certificate 
          # directly into your project files so they sign correctly.
          xcode-project use-profiles
      - name: Build and Package IPA
        script: |
          # We use xcode-project build-ipa which is safer for manual signing
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --bundle-id "$BUNDLE_ID"
    artifacts:
      - build/ios/ipa/*.ipa
