workflows:
  build-wda:
    name: Build WDA IPA (Signed)
    max_build_duration: 25
    environment:
      xcode: 16.0
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.wda.34QXW692J2
      vars:
        BUNDLE_ID: "com.beanerflicker.wda.34QXW692J2"
        TEAM_ID: "34QXW692J2"
        PROFILE_NAME: "WDA_Profile" 
        XCODE_PROJECT: "WebDriverAgent.xcodeproj"
        XCODE_SCHEME: "WebDriverAgentRunner"
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Prepare Project and Signing
        script: |
          # 1. Global Patch: Replace the default Facebook ID and Team ID everywhere in the project file
          # This prevents the '.xctrunner' suffix error
          sed -i '' "s/com.facebook.WebDriverAgentRunner/$BUNDLE_ID/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          
          # 2. Force Manual Signing and link the specific Profile Reference Name
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*;/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" "$XCODE_PROJECT/project.pbxproj"

          # 3. Initialize the signing environment on the build machine
          xcode-project use-profiles
      - name: Build and Package IPA
        script: |
          # 1. Clean old build artifacts
          rm -rf build Payload WebDriverAgent.ipa

          # 2. Build the app
          # We use the build action (not build-for-testing) to keep the Bundle ID stable
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="$CM_CERTIFICATE_NAME" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual

          # 3. Locate the .app folder
          RUNNER_APP=$(find ./build/Build/Products -name "*.app" -type d | head -n 1)
          
          if [ -z "$RUNNER_APP" ]; then
            echo "FAILED: Could not find the .app folder!"
            exit 1
          fi

          # 4. Construct the Payload folder (This structure is mandatory for iOS)
          mkdir Payload
          cp -LR "$RUNNER_APP" Payload/
          
          # 5. Zip it (the -y flag preserves symlinks which are vital for iOS frameworks)
          zip -ry WebDriverAgent.ipa Payload
    artifacts:
      - "*.ipa"
