workflows:
  build-wda:
    name: Build WDA IPA
    max_build_duration: 25
    environment:
      xcode: 26.4
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner
      - name: Build
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO
      - name: Sign and Package
        script: |
          APP=$(find ./build -name "*.app" \
            -not -path "*/PlugIns/*" | head -1)
          echo "Found: $APP"

          # Sign every binary with ad-hoc signature
          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign - "$f" 2>/dev/null || true
            fi
          done

          # Sign the full bundle
          codesign --force --deep --sign - "$APP"

          # Verify signature
          codesign --verify --verbose "$APP" && echo "SIGNATURE VALID" || echo "SIGNATURE FAILED"

          # Package
          mkdir -p /tmp/Payload
          cp -r "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.zip Payload/
          mv WebDriverAgent.zip ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"
    artifacts:
      - ~/WebDriverAgent.ipa
