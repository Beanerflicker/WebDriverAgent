workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: 26.4
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner

      - name: Build unsigned
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.beanerflicker.WebDriverAgentRunner

      - name: Sign with developer certificate
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"

          # Get certificate name and team ID
          CERT=$(security find-identity -v -p codesigning \
            | grep "Apple Development" | head -1 \
            | awk -F'"' '{print $2}')
          CERT_TEAM=$(echo "$CERT" | grep -oE '\([A-Z0-9]{10}\)' | tr -d '()')
          echo "Certificate: $CERT"
          echo "Certificate Team: $CERT_TEAM"

          # Find xctrunner provisioning profile
          PROFILE=""
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            security cms -D -i "$f" > /tmp/profile_check.plist 2>/dev/null
            APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" \
              /tmp/profile_check.plist 2>/dev/null || echo "")
            echo "Checking profile: $APP_ID"
            if echo "$APP_ID" | grep -q "xctrunner"; then
              PROFILE="$f"
              echo "Using profile: $f"
              echo "Profile App ID: $APP_ID"
              break
            fi
          done

          if [ -z "$PROFILE" ]; then
            echo "xctrunner profile not found — using certificate team for entitlements"
          fi

          # Write entitlements using certificate team ID
          cat > /tmp/entitlements.plist << ENTEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>${CERT_TEAM}.com.beanerflicker.WebDriverAgentRunner.xctrunner</string>
              <key>com.apple.developer.team-identifier</key>
              <string>${CERT_TEAM}</string>
              <key>get-task-allow</key>
              <true/>
              <key>keychain-access-groups</key>
              <array>
                  <string>${CERT_TEAM}.com.beanerflicker.WebDriverAgentRunner.xctrunner</string>
              </array>
          </dict>
          </plist>
          ENTEOF

          echo "Entitlements written:"
          cat /tmp/entitlements.plist

          # Embed provisioning profile if found
          if [ -n "$PROFILE" ]; then
            cp "$PROFILE" "$APP/embedded.mobileprovision"
            echo "Embedded profile"
          fi

          # Sign all Mach-O binaries
          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign "$CERT" \
                --entitlements /tmp/entitlements.plist \
                "$f" 2>/dev/null || true
            fi
          done

          # Sign full bundle
          codesign --force --deep --sign "$CERT" \
            --entitlements /tmp/entitlements.plist \
            "$APP"

          # Verify
          codesign --verify --verbose "$APP" \
            && echo "SIGNATURE VALID" \
            || echo "SIGNATURE FAILED"

          echo "Entitlements in signed binary:"
          codesign -d --entitlements - "$APP" 2>/dev/null || true

      - name: Package IPA
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          mkdir -p /tmp/Payload
          cp -rp "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"

    artifacts:
      - ~/WebDriverAgent.ipa
