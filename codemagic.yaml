- name: Package
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"

          # Convert all plists to XML
          find "$APP" -name "*.plist" | while read plist; do
            plutil -convert xml1 "$plist" 2>/dev/null || true
          done

          # Set bundle ID
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleIdentifier com.beanerflicker.wda" \
            "$APP/Info.plist"

          # Remove the Testing.framework dependency from XCTestCore
          # so it doesn't try to load lib_TestingInterop.dylib
          XCTESTCORE="$APP/Frameworks/XCTestCore.framework/XCTestCore"
          echo "Removing Testing dependency from XCTestCore..."
          install_name_tool -change \
            "@rpath/Testing.framework/Testing" \
            "/usr/lib/swift/Testing.framework/Testing" \
            "$XCTESTCORE" 2>/dev/null || true

          # Also patch Testing.framework itself
          TESTING="$APP/Frameworks/Testing.framework/Testing"
          echo "Patching Testing.framework rpaths..."
          install_name_tool -add_rpath "/usr/lib/swift" \
            "$TESTING" 2>/dev/null || true

          echo "Frameworks:"
          ls "$APP/Frameworks/"

          # Write entitlements
          cat > /tmp/entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
              <key>application-identifier</key>
              <string>com.beanerflicker.wda</string>
              <key>keychain-access-groups</key>
              <array>
                  <string>com.beanerflicker.wda</string>
              </array>
          </dict>
          </plist>
          EOF

          # Sign with entitlements
          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign - \
                --entitlements /tmp/entitlements.plist \
                "$f" 2>/dev/null || true
            fi
          done
          codesign --force --deep --sign - \
            --entitlements /tmp/entitlements.plist \
            "$APP"

          # Package
          mkdir -p /tmp/Payload
          cp -rp "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"
    artifacts:
      - ~/WebDriverAgent.ipa
