workflows:
  build-wda:
    name: Build WDA IPA (Signed)
    max_build_duration: 25
    environment:
      xcode: 16.0
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.wda.34QXW692J2
      vars:
        BUNDLE_ID: "com.beanerflicker.wda.34QXW692J2"
        XCODE_PROJECT: "WebDriverAgent.xcodeproj"
        XCODE_SCHEME: "WebDriverAgentRunner"
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Prepare Project and Signing
        script: |
          # Force the project to use the full Bundle ID from your screenshot
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          
          # This command will automatically find your uploaded cert and profile 
          # by matching the bundle_identifier we set above.
          xcode-project use-profiles
      - name: Build and Package IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --configuration Debug
    artifacts:
      - build/ios/ipa/*.ipa
