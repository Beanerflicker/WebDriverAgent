workflows:
  build-wda:
    name: Build WDA IPA
    max_build_duration: 25
    environment:
      xcode: 26.4
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner
      - name: Build
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            EXCLUDED_ARCHS=x86_64
      - name: Package
        script: |
          cd ./build/Build/Products/Debug-iphoneos

          APP="WebDriverAgentRunner-Runner.app"
          echo "App exists: $(test -d "$APP" && echo YES || echo NO)"
          echo "Info.plist exists: $(test -f "$APP/Info.plist" && echo YES || echo NO)"
          echo "File count in app: $(find "$APP" -type f | wc -l)"

          # Convert plists to XML
          find "$APP" -name "*.plist" | while read plist; do
            plutil -convert xml1 "$plist" 2>/dev/null || true
          done

          # Set bundle ID
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleIdentifier com.beanerflicker.wda" \
            "$APP/Info.plist"

          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleIdentifier" "$APP/Info.plist")"

          # Sign
          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign - "$f" 2>/dev/null || true
            fi
          done
          codesign --force --deep --sign - "$APP"

          # Package from right here
          mkdir -p Payload
          cp -rp "$APP" Payload/
          
          echo "Files in Payload: $(find Payload -type f | wc -l)"
          
          /usr/bin/zip -r ~/WebDriverAgent.ipa Payload/
          
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"
          echo "Info.plist in IPA: $(zipinfo ~/WebDriverAgent.ipa | grep Info.plist | head -5)"
    artifacts:
      - ~/WebDriverAgent.ipa
