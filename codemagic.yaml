workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: 26.4
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner

      - name: Build unsigned
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.beanerflicker.WebDriverAgentRunner

      - name: Sign with developer certificate
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          echo "App found: $(test -d "$APP" && echo YES || echo NO)"
          echo "File count: $(find "$APP" -type f | wc -l)"

          # Get real Apple Development certificate from keychain
          CERT=$(security find-identity -v -p codesigning \
            | grep "Apple Development" | head -1 \
            | awk -F'"' '{print $2}')
          echo "Signing certificate: $CERT"

          # Find the xctrunner provisioning profile
          PROFILE=""
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            PLIST=$(security cms -D -i "$f")
            APP_ID=$(echo "$PLIST" | grep -A1 "application-identifier" \
              | grep string | sed 's/.*<string>//;s/<\/string>//')
            if echo "$APP_ID" | grep -q "xctrunner"; then
              PROFILE="$f"
              echo "Found xctrunner profile: $f"
              break
            fi
          done

          if [ -z "$PROFILE" ]; then
            echo "ERROR: xctrunner profile not found"
            exit 1
          fi

          # Embed provisioning profile into app bundle
          cp "$PROFILE" "$APP/embedded.mobileprovision"
          echo "Embedded profile"

          # Extract entitlements from the provisioning profile
          security cms -D -i "$PROFILE" \
            | /usr/libexec/PlistBuddy -x \
              -c "Print :Entitlements" /dev/stdin \
            > /tmp/entitlements.plist
          echo "Entitlements:"
          cat /tmp/entitlements.plist

          # Sign all Mach-O binaries inside the bundle
          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign "$CERT" \
                --entitlements /tmp/entitlements.plist \
                "$f" 2>/dev/null || true
            fi
          done

          # Sign the full app bundle
          codesign --force --deep --sign "$CERT" \
            --entitlements /tmp/entitlements.plist \
            "$APP"

          # Verify signature
          codesign --verify --verbose "$APP" \
            && echo "SIGNATURE VALID" \
            || echo "SIGNATURE FAILED"

      - name: Package IPA
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"

          mkdir -p /tmp/Payload
          cp -rp "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"

    artifacts:
      - ~/WebDriverAgent.ipa
