workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: 26.4
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.wda
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner

      - name: Get signing info
        script: |
          # Get Team ID
          TEAM_ID=$(security find-identity -v -p codesigning \
            | grep "Apple Development\|iPhone Developer" \
            | head -1 \
            | grep -o '([A-Z0-9]\{10\})' \
            | tr -d '()')
          echo "Team ID: $TEAM_ID"

          # Get provisioning profile UUID
          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles \
            -name "*.mobileprovision" | head -1)
          echo "Profile path: $PROFILE_PATH"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" \
            /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
          echo "Profile UUID: $UUID"

          echo "TEAM_ID=$TEAM_ID"   >> $CM_ENV
          echo "PROFILE_UUID=$UUID" >> $CM_ENV

      - name: Build and Sign
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            DEVELOPMENT_TEAM=$TEAM_ID \
            PRODUCT_BUNDLE_IDENTIFIER=com.beanerflicker.wda \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE=$PROFILE_UUID \
            CODE_SIGN_IDENTITY="Apple Development" \
            WEBDRIVERAGENTLIB_DEVELOPMENT_TEAM=$TEAM_ID \
            WEBDRIVERAGENTLIB_CODE_SIGN_STYLE=Automatic \
            "WEBDRIVERAGENTLIB_CODE_SIGN_IDENTITY=Apple Development"

      - name: Package IPA
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          echo "App found: $(test -d "$APP" && echo YES || echo NO)"
          echo "File count: $(find "$APP" -type f | wc -l)"

          mkdir -p /tmp/Payload
          cp -rp "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"

    artifacts:
      - ~/WebDriverAgent.ipa
