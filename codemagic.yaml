workflows:
  build-wda:
    name: Build WDA IPA
    max_build_duration: 25
    environment:
      xcode: 26.4
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner
      - name: Build
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            EXCLUDED_ARCHS=x86_64
      - name: Package
        script: |
          APP="./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          BINARY="$APP/WebDriverAgentRunner-Runner"

          echo "App exists: $(test -d "$APP" && echo YES || echo NO)"
          echo "Binary exists: $(test -f "$BINARY" && echo YES || echo NO)"

          # Convert all plists to XML
          find "$APP" -name "*.plist" | while read plist; do
            plutil -convert xml1 "$plist" 2>/dev/null || true
          done

          # Set bundle ID
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleIdentifier com.beanerflicker.wda" \
            "$APP/Info.plist"

          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleIdentifier" "$APP/Info.plist")"

          # Write entitlements file
          cat > /tmp/entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
              <key>application-identifier</key>
              <string>com.beanerflicker.wda</string>
              <key>keychain-access-groups</key>
              <array>
                  <string>com.beanerflicker.wda</string>
              </array>
          </dict>
          </plist>
          EOF

          # Sign every framework and binary with entitlements
          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign - \
                --entitlements /tmp/entitlements.plist \
                "$f" 2>/dev/null || true
            fi
          done

          # Sign the whole app bundle with entitlements
          codesign --force --deep --sign - \
            --entitlements /tmp/entitlements.plist \
            "$APP"

          # Verify entitlements are in the binary
          echo "Entitlements in binary:"
          codesign -d --entitlements - "$BINARY" 2>/dev/null || true

          # Package
          mkdir -p /tmp/Payload
          cp -rp "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"
    artifacts:
      - ~/WebDriverAgent.ipa
