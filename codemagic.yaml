workflows:
  build-wda:
    name: Build WDA IPA
    max_build_duration: 25
    environment:
      xcode: 26.4
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner
      - name: Build
        script: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            EXCLUDED_ARCHS=x86_64
      - name: Find all apps
        script: |
          echo "=== ALL APP BUNDLES ==="
          find ./build -name "*.app" | sort
          echo "=== ALL INFO.PLIST FILES ==="
          find ./build -name "Info.plist" | sort
      - name: Package
        script: |
          # Find the Runner app specifically - it has the main executable
          APP=$(find ./build -name "WebDriverAgentRunner-Runner.app" \
            -not -path "*.dSYM*" | head -1)
          
          # If not found try any .app not in dSYM
          if [ -z "$APP" ]; then
            APP=$(find ./build -name "*.app" \
              -not -path "*.dSYM*" \
              -not -path "*.xctest*" | head -1)
          fi

          echo "Using app: $APP"
          echo "App contents:"
          ls -la "$APP"

          # Verify Info.plist exists
          if [ ! -f "$APP/Info.plist" ]; then
            echo "ERROR: No Info.plist found"
            exit 1
          fi

          # Convert plists to XML
          find "$APP" -name "*.plist" | while read plist; do
            plutil -convert xml1 "$plist" 2>/dev/null || true
          done

          # Set bundle ID
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleIdentifier com.beanerflicker.wda" \
            "$APP/Info.plist"

          echo "Bundle ID set to: $(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleIdentifier" "$APP/Info.plist")"

          # Sign
          find "$APP" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign - "$f" 2>/dev/null || true
            fi
          done
          codesign --force --deep --sign - "$APP"

          # Package
          mkdir -p /tmp/Payload
          cp -r "$APP" /tmp/Payload/
          cd /tmp
          /usr/bin/zip -r WebDriverAgent.ipa Payload/
          cp WebDriverAgent.ipa ~/WebDriverAgent.ipa
          echo "Final size: $(du -sh ~/WebDriverAgent.ipa)"
          echo "IPA contents:"
          zipinfo ~/WebDriverAgent.ipa | head -20
    artifacts:
      - ~/WebDriverAgent.ipa
