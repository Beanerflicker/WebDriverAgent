workflows:
  build-wda:
    name: Build WDA IPA (Signed)
    max_build_duration: 25
    environment:
      xcode: 16.0
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.wda.34QXW692J2
      vars:
        BUNDLE_ID: "com.beanerflicker.wda.34QXW692J2"
        XCODE_PROJECT: "WebDriverAgent.xcodeproj"
        XCODE_SCHEME: "WebDriverAgentRunner"
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Prepare Project and Signing
        script: |
          # Force the project to use your specific Bundle ID
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          
          # Initialize the signing environment on the Mac
          xcode-project use-profiles
      - name: Build and Package IPA
        script: |
          # 1. Build the WebDriverAgentRunner app
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            -derivedDataPath ./build

          # 2. Locate the .app folder (Fixes the APIInternalError)
          APP_DIR=$(find ./build -name "WebDriverAgentRunner-Runner.app" | head -n 1)
          echo "Found app at: $APP_DIR"

          # 3. Create the correct folder structure for Apple installation
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          
          # 4. Zip into a valid IPA file
          zip -qr WebDriverAgent.ipa Payload
    artifacts:
      - "*.ipa"
