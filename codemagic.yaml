workflows:
  build-wda:
    name: Build WDA IPA Developer Signed
    max_build_duration: 25
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.beanerflicker.WebDriverAgentRunner.xctrunner
    scripts:
      - name: Inject iOS 17+ Launch Compatibility Implementation
        script: |
          set -e
          echo "[*] Locating target test runner compilation source..."
          TARGET_M_FILE=$(find . -path "*WebDriverAgentRunner*/*" \( -name "UITestingUITests.m" -o -name "UITestingUITests.mm" \) | head -n 1)
          if [ -z "$TARGET_M_FILE" ]; then
              echo "[!] Warning: UITestingUITests.m not found. Searching for any runner source..."
              TARGET_M_FILE=$(find . -path "*WebDriverAgentRunner*/*" -name "*.m" | head -n 1)
          fi
          if [ -z "$TARGET_M_FILE" ]; then
              echo "[-] Error: No compiled source targets inside WebDriverAgentRunner folder."
              exit 1
          fi
          
          echo "[+] Prepending dynamic Obj-C runtime stub into: $TARGET_M_FILE"
          
          # Create prepend file with ARC-agnostic dynamic implementation
          cat << 'EOF' > /tmp/stub.m

          // =========================================================================
          // WebDriverAgent iOS 17+ Launch Compatibility Dynamic Prepended Injection
          // =========================================================================
          #import <objc/runtime.h>
          #import <objc/message.h>
          #import <Foundation/Foundation.h>

          static id dynamic_config_stub(id self, SEL _cmd, id arg1, id arg2, BOOL arg3, void *arg4) {
              NSLog(@"[+] WDA Launch Stub (Dynamic): configurationFromCommandLineArguments invoked successfully.");
              return nil;
          }

          __attribute__((constructor)) static void force_link_compatibility_stub(void) {
              Class targetClass = objc_getClass("XCTCommandLineToolHelper");
              if (targetClass == Nil) {
                  Class superClass = objc_getClass("NSObject");
                  if (superClass != Nil) {
                      targetClass = objc_allocateClassPair(superClass, "XCTCommandLineToolHelper", 0);
                      if (targetClass != Nil) {
                          Class metaClass = object_getClass(targetClass);
                          if (metaClass != Nil) {
                              SEL selector = sel_registerName("configurationFromCommandLineArguments:userDefaults:requiresTestBundleURL:outError:");
                              class_addMethod(metaClass, selector, (IMP)dynamic_config_stub, "@@:@@B^@");
                          }
                          objc_registerClassPair(targetClass);
                      }
                  }
              }
          }
          // =========================================================================

          EOF
          
          # Append original source code to the temp file, then overwrite original source
          cat "$TARGET_M_FILE" >> /tmp/stub.m
          mv /tmp/stub.m "$TARGET_M_FILE"
          echo "[+] Dynamic prepend completed successfully."

      - name: Build WDA
        script: |
          set -e
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Bundle and package developer frameworks
        script: |
          set -e
          APP=$(find ./build/Build/Products/Debug-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then 
            echo "[-] ERROR: No .app bundle found"
            exit 1
          fi
          
          echo "[+] Processing bundle path: $APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL" "$APP/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :LSBackgroundOnly" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.beanerflicker.WebDriverAgentRunner.xctrunner" "$APP/Info.plist"
          
          # Setup bundle structure
          XCODE_DEV=$(xcode-select -p)
          mkdir -p "$APP/Frameworks"
          
          echo "[+] Copying runtime interoperability dylibs and frameworks..."
          cp "$XCODE_DEV/Platforms/iPhoneOS.platform/Developer/usr/lib/lib_TestingInterop.dylib" "$APP/Frameworks/"
          cp -R "$XCODE_DEV/Platforms/iPhoneOS.platform/Developer/Library/Frameworks/_Testing_Foundation.framework" "$APP/Frameworks/"
          cp -R "$XCODE_DEV/Platforms/iPhoneOS.platform/Developer/Library/Frameworks/XCTest.framework" "$APP/Frameworks/"

          # Extract entitlements
          EXP_KEY=$(security find-identity -v -p codesigning | grep "Development" | head -n 1 | awk -F'"' '{print $2}')
          PROF=$(grep -l "com.beanerflicker.WebDriverAgentRunner.xctrunner" /Users/builder/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          cp "$PROF" "$APP/embedded.mobileprovision"
          python3 -c "import plistlib; data=open('$APP/embedded.mobileprovision','rb').read(); start=data.find(b'<?xml'); end=data.find(b'</plist>')+8; plist=plistlib.loads(data[start:end]); plistlib.dump(plist['Entitlements'], open('/tmp/entitlements.plist','wb'))"

          # Recursive signing of nested binaries (Inside-Out)
          XCT_FRAMEWORKS="$APP/PlugIns/WebDriverAgentRunner.xctest/Frameworks"
          if [ -d "$XCT_FRAMEWORKS" ]; then
              find "$XCT_FRAMEWORKS" -type f \( -name "*.dylib" -o -name "WebDriverAgentLib" \) | while read -r lib; do
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$lib"
              done
              find "$XCT_FRAMEWORKS" -name "*.framework" | while read -r fw; do
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$fw"
              done
          fi
          
          XCT_PLUGINS="$APP/PlugIns"
          if [ -d "$XCT_PLUGINS" ]; then
              find "$XCT_PLUGINS" -name "*.xctest" | while read -r plugin; do
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$plugin"
              done
          fi
          
          APP_FRAMEWORKS="$APP/Frameworks"
          if [ -d "$APP_FRAMEWORKS" ]; then
              find "$APP_FRAMEWORKS" -type f -name "*.dylib" | while read -r dylib; do
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$dylib"
              done
              find "$APP_FRAMEWORKS" -name "*.framework" | while read -r framework; do
                  codesign --force --sign "$EXP_KEY" --timestamp=none "$framework"
              done
          fi
          
          # Final sign on the host app bundle
          codesign --force --sign "$EXP_KEY" --entitlements /tmp/entitlements.plist --timestamp=none "$APP"

      - name: Package IPA
        script: |
          set -e
          APP=$(find ./build/Build/Products/Debug-iphoneos -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r WebDriverAgent.ipa Payload
    artifacts:
      - WebDriverAgent.ipa
